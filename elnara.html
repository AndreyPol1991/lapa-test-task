  function pBrief() {
    const m = people.get(F.brief.from) || { name: 'Марина Сергеевна Белова', role: 'генеральный директор' };
    return `<div class="page">
      <section class="sec"><span class="eyebrow">${F.icon} ${esc(F.title)}</span><h1>Запрос заказчика</h1>
        <div class="prose">${F.why.map(p => `<p>${p}</p>`).join('')}</div></section>
      <section class="letter">
        <div class="letter-h"><span>От</span><span>${esc(m.name)}, ${esc(m.role)}</span><span>Кому</span><span>${esc(F.student)}, системный аналитик</span><span>Тема</span><span><b>${esc(F.brief.subject)}</b></span></div>
        <div class="letter-b">${F.brief.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>
      </section>
      <section class="grid2">
        <div class="card"><h3>Что точно в твоей зоне</h3><ul class="small">${F.zone.map(z => `<li>${z}</li>`).join('')}</ul></div>
        <div class="note warn"><b>Письмо — не требования</b><p class="small">Заказчик пишет как чувствует, а не как надо разработчику. Тут есть расплывчатые слова, пропуски и вещи, которые другие люди видят иначе. Твоя работа — превратить это в однозначные правила. Начни с документов, потом иди на интервью.</p></div>
        <div class="card flat"><h3>Упражнение на 10 минут</h3><ol class="small"><li>Выпиши из письма все расплывчатые слова: «удобно», «быстро», «правильно», «как в нормальных клиниках», «что-то делать».</li><li>Каждое преврати в вопрос: «удобно» — кому и в чём? «быстро» — это сколько секунд или минут?</li><li>Выпиши всех людей, которых упоминает заказчик, — к каждому нужно сходить.</li><li>Эти вопросы и люди — твой план интервью.</li></ol></div>
      </section></div>`;
  }

  function pDocs() {
    const cur = F.docs.find(d => d.id === S.doc) || F.docs[0];
    S.docsSeen[cur.id] = true;
    return `<div class="page"><section class="sec"><h1>Документы «как есть»</h1><p class="lead">Что прислали из клиник и что удалось найти. Читай внимательно: важное спрятано в деталях. Под каждым документом — место для твоих заметок, они попадут в выгрузку блокнота.</p></section>
      <section class="docs"><nav class="doc-list" aria-label="Документы">${F.docs.map(d => `<button class="doc-btn" data-act="doc" data-id="${d.id}" aria-current="${d.id === cur.id}"><span class="k">${esc(d.kind)}</span><span>${esc(d.title)}</span>${S.docsSeen[d.id] ? '<span class="seen">✓ прочитан</span>' : ''}</button>`).join('')}</nav>
      <div class="doc-view"><div><h2>${esc(cur.title)}</h2><p class="muted small">${esc(cur.kind)} · от: ${esc(cur.from || '—')} · ${esc(cur.intro)}</p></div>
        <div class="paper">${cur.html}</div>
        <div class="sec"><label class="eyebrow" for="dn">Мои заметки по документу</label><textarea id="dn" data-act="docnote" data-id="${cur.id}" placeholder="Что здесь важно для требований? Числа, исключения, жалобы, вопросы к интервью…">${esc(S.docNotes[cur.id] || '')}</textarea></div>
      </div></section></div>`;
  }

  function pInterview() {
    const cur = people.get(S.person) || F.people[0];
    const pid = cur.id;
    const total = F.questions.filter(q => q.who === pid).length;
    let h = `<div class="page"><section class="sec"><h1>Интервью</h1><p class="lead">Выбери человека и задавай вопросы. Уточняющие вопросы появляются после основных, к некоторым людям стоит вернуться, когда узнаешь что-то от других. Не всё, что говорят, — требование, и не все вопросы одинаково полезны.</p>
      <div class="row small muted"><span class="chip">⏱ ${minutes()} мин на встречах</span><span class="chip">💬 ${S.asked.length + S.free.length} вопросов задано</span><span class="chip acc">📒 ${Object.keys(S.nb).length} в блокноте</span></div></section>
      <section class="iv"><nav class="people" aria-label="Люди">${F.people.map(p => {
        const n = F.questions.filter(q => q.who === p.id && asked(q.id)).length;
        const av = F.questions.filter(q => q.who === p.id && available(q)).length;
        return `<button class="person" data-act="person" data-id="${p.id}" aria-current="${p.id === pid}"><span class="em">${p.emoji}</span><span class="nm">${esc(p.name)}</span><span class="rl">${esc(p.role)}</span><span class="cnt">задано ${n} · можно ещё ${av} · ${minutes(p.id)} мин</span></button>`;
      }).join('')}</nav>
      <div class="meeting">
        <details class="card flat"><summary style="cursor:pointer;font-weight:600">💡 Как задавать вопросы — памятка</summary>
          <div class="sec" style="margin-top:10px">${C.askGuide.map(([t, d, ex]) => `<div class="small"><b>${esc(t)}.</b> ${esc(d)} <span class="muted">${esc(ex)}</span></div>`).join('')}
          <div class="small"><b>Чего избегать:</b><ul>${C.askAvoid.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div></details>
        <div class="m-head"><span class="em">${cur.emoji}</span><div><h2>${esc(cur.name)}</h2><p class="muted small">${esc(cur.role)}</p></div></div>
        ${(C.focus[F.code] || {})[pid] ? `<p class="simple small"><b>Зачем идти:</b> ${esc(C.focus[F.code][pid])}</p>` : ''}
        <div class="say">${cur.hello}</div>
        <div class="log">`;
    const log = S.asked.map(id => qmap.get(id)).filter(q => q && q.who === pid);
    for (const q of log) h += qaBlock(q.q, q.a, q.facts, 'q:' + q.id);
    for (const [i, x] of S.free.entries()) if (x.who === pid) h += qaBlock('✍ ' + x.q, esc(x.a), x.facts || [], 'free:' + i);
    h += `</div>`;
    const av = F.questions.filter(q => q.who === pid && available(q));
    if (av.length) {
      const topics = [...new Set(av.map(q => q.topic))];
      h += `<div class="qbank"><h3>Что спросить</h3>${topics.map(t => `<div class="topic"><h4>${esc(t)}</h4>${av.filter(q => q.topic === t).map(q => `<button class="qbtn" data-act="ask" data-id="${q.id}"><span>${esc(q.q)}</span>${q.kind === 'conflict' ? '<span class="tag">противоречие</span>' : (q.requires || []).length ? '<span class="tag">уточнение</span>' : ''}<span class="mn">${q.min} мин</span></button>`).join('')}</div>`).join('')}</div>`;
    } else {
      h += `<div class="note"><b>Вопросы к этому человеку закончились</b><p class="small">${log.length}/${total} заданы. Возможно, сюда стоит вернуться позже — когда в блокноте появится то, что нужно обсудить с ним.</p></div>`;
    }
    h += `<div class="free" id="free-box" hidden><h3>Свой вопрос</h3><p class="muted small">Ответит Claude в роли этого человека — только в рамках того, что персонаж знает. Расходует лимит твоего аккаунта Claude.</p>
        <textarea id="free-q" placeholder="Например: а что происходит, если…"></textarea>
        <div class="row"><button class="btn" data-act="free" data-id="${pid}">Спросить</button><span class="muted small" id="free-st"></span></div></div>`;
    h += `</div></section></div>`;
    return h;
  }

  function qaBlock(q, a, fids, src) {
    let h = `<div class="qa"><div class="ask">${esc(q)}</div><div class="say">${a}</div>`;
    if (fids && fids.length) {
      h += `<div class="facts-out">${fids.map(id => {
        const f = facts.get(id); if (!f) return '';
        return inNb(id)
          ? `<div class="fact-add in"><span class="t">${esc(f.text)}</span><span class="chip acc">в блокноте</span></div>`
          : `<div class="fact-add"><span class="t">${esc(f.text)}</span><button class="btn sm" data-act="add" data-id="${id}" data-src="${esc(src)}">＋ В блокнот</button></div>`;
      }).join('')}</div>`;
    }
    return h + `</div>`;
  }

  function srcLabel(src) {
    if (!src) return '';
    const [kind, id] = src.split(':');
    if (kind === 'q') { const q = qmap.get(id); return q ? `${people.get(q.who).name} · «${q.q}»` : ''; }
    if (kind === 'free') { const x = S.free[+id]; return x ? `${people.get(x.who)?.name} · свой вопрос «${x.q}»` : ''; }
    return '';
  }

  function pNotebook() {
    const ids = Object.keys(S.nb).filter(id => facts.has(id));
    const pairs = conflictPairs().filter(p => inNb(p.a) && inNb(p.b));
    let h = `<div class="page"><section class="sec"><h1>Блокнот аналитика</h1><p class="lead">Всё, что записано на интервью, заметки по документам, допущения и открытые вопросы. Отсюда — в спецификацию. Выгрузка блокнота — обязательная часть пакета.</p>
      <div class="stats"><div class="stat"><b>${ids.length}</b><span>фактов записано</span></div><div class="stat"><b>${minutes()}</b><span>минут интервью</span></div><div class="stat"><b>${S.asked.length + S.free.length}</b><span>вопросов задано</span></div><div class="stat"><b>${Object.keys(S.docsSeen).length}/${F.docs.length}</b><span>документов прочитано</span></div><div class="stat"><b>${hintsUsed()}</b><span>подсказок открыто</span></div></div>
      <div class="row"><button class="btn primary" data-act="export-dl">⬇ Скачать interview-notes.md</button><button class="btn" data-act="export-copy">Скопировать как Markdown</button></div></section>`;
    if (pairs.length) {
      h += `<section class="sec"><h2>Противоречия</h2>${pairs.map(p => {
        const done = p.res && asked(p.res.id);
        return `<div class="note ${done ? '' : 'bad'}"><b>${done ? '✓ Решено' : '⚔ Нужно решение'}</b><p class="small">«${esc(facts.get(p.a).text)}»<br>против<br>«${esc(facts.get(p.b).text)}»</p>${done ? `<p class="small muted">Решение принял: ${esc(people.get(p.res.who).name)}. Не забудь записать решение в блокнот и в журнал решений спецификации.</p>` : '<p class="small">Аналитик не выбирает сам. Подумай, кто отвечает за этот вопрос, и сходи к нему: у него появился новый вопрос.</p>'}</div>`;
      }).join('')}</section>`;
    }
    const emptyCats = Object.entries(C.cats).filter(([cat]) => F.facts.some(f => f.cat === cat) && !ids.some(id => facts.get(id).cat === cat)).map(([, l]) => l);
    if (ids.length && emptyCats.length) h += `<section class="note warn"><b>В блокноте пока ничего нет про:</b><p class="small">${emptyCats.map(esc).join(' · ')}</p><p class="small muted">Обычно в таких фичах здесь тоже есть требования. Подумай, кто может об этом знать, и спроси.</p></section>`;
    h += `<section class="sec"><h2>Факты</h2>`;
    if (!ids.length) h += `<p class="muted">Пока пусто. Иди на вкладку «Интервью» и записывай важное кнопкой «＋ В блокнот».</p>`;
    for (const [cat, label] of Object.entries(C.cats)) {
      const list = ids.filter(id => facts.get(id).cat === cat);
      if (!list.length) continue;
      h += `<div class="card"><h3>${label} <span class="muted small">${list.length}</span></h3>${list.map(id => `<div class="nb-item"><span>${esc(facts.get(id).text)}${facts.get(id).conflict && inNb(facts.get(id).conflict) ? ' <span class="chip bad">противоречие</span>' : ''}</span><button class="x" title="Убрать из блокнота" aria-label="Убрать" data-act="unfact" data-id="${id}">×</button><span class="src">${esc(srcLabel(S.nb[id].src))}</span></div>`).join('')}</div>`;
    }
    h += `</section><section class="grid2">${listEditor('assum', 'Допущения', 'Что решено без ответа заказчика — и почему')}${listEditor('open', 'Открытые вопросы', 'Что осталось непонятным и кому задать')}</section>
      ${listEditor('notes', 'Прочие заметки', 'Идеи, наблюдения, договорённости с соседями')}</div>`;
    return h;
  }

  function listEditor(key, title, ph) {
    return `<div class="card"><h3>${title}</h3>${(S[key] || []).map((t, i) => `<div class="nb-item"><span>${esc(t)}</span><button class="x" aria-label="Удалить" data-act="del-${key}" data-id="${i}">×</button></div>`).join('') || '<p class="muted small">Пока пусто.</p>'}
      <textarea id="in-${key}" placeholder="${esc(ph)}"></textarea><div><button class="btn sm" data-act="add-${key}">Добавить</button></div></div>`;
  }

      <div class="map card">${seamMap(F.code)}</div></section>
      ${F.seams.map(s => `<section class="card seam" style="--feat2:${(C.features.find(f => f.code === s.with) || {}).color}">
        <div class="row" style="justify-content:space-between"><h2>${s.id}. ${esc(s.title)}</h2><span class="chip">с ${esc(s.partner)}</span></div>
        <div class="give-take"><div><h4>Ты отдаёшь соседу</h4><ul class="small">${s.give.map(x => `<li>${x}</li>`).join('')}</ul></div><div><h4>Ты берёшь у соседа</h4><ul class="small">${s.take.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
        <h4>Базовый контракт от наставника</h4><div class="small prose">${s.base}</div>
        <h4>Договорить на встрече</h4>
        <div class="sec">${s.agree.map((a, i) => { const k = s.id + ':' + i; return `<label class="check"><input type="checkbox" data-act="agree" data-id="${k}" ${S.agree[k] ? 'checked' : ''}><span class="small">${a}</span></label>`; }).join('')}</div>
      </section>`).join('')}
      <section class="sec"><h2>Протокол стыковой встречи</h2><p class="muted">Скопируй, заполните вместе, вставьте в раздел 10.3 обоих пакетов.</p><pre id="proto">${esc(protocol())}</pre><div><button class="btn" data-act="copy-proto">Скопировать шаблон протокола</button></div></section></div>`;
  }

  function protocol() {
    return F.seams.map(s => `### ${s.id}. ${s.title} — протокол
Дата: ГГГГ-ММ-ДД. Участники: ${F.student}, ${s.partner}.

| № | Вопрос | Решение | Кто вызывает / публикует | Поля / событие | Что при повторе и сбое |
|---|---|---|---|---|---|
${s.agree.map((a, i) => `| ${i + 1} | ${a.replace(/<[^>]+>/g, '')} | | | | |`).join('\n')}

Изменения базового контракта: нет (только дополнения).
`).join('\n');
  }

  function pPack() {
    return `<div class="page"><section class="sec"><h1>Сдача</h1><p class="lead">Пакет — это то, что наставник отдаст ИИ-разработчику. Он не будет спрашивать «а что имелось в виду» — он сделает ровно то, что написано, а где не написано — придумает сам.</p></section>
      <section class="grid2"><div class="card"><h3>Состав пакета</h3><div class="files">lapa-${F.code}/
├─ README.md            что за фича и как читать пакет
├─ SPEC.md              спецификация по шаблону
├─ openapi.yaml         контракт API ${META.api}
├─ seed.json            тестовые данные
└─ interview-notes.md   выгрузка блокнота</div><p class="small muted">Отправь папку архивом наставнику до срока. Пакеты соседей не нужны, но раздел «Стыки» должен совпадать с ними.</p></div>
      <div class="card"><h3>Шаблоны</h3><p class="small">Пример в каждом разделе шаблона — из другой предметной области. Он показывает форму, а не ответ.</p>
        ${[['SPEC.md', 'spec'], ['openapi.yaml', 'openapi'], ['seed.json', 'seed'], ['README.md', 'readme']].map(([n, k]) => `<div class="row"><code>${n}</code><button class="btn sm" data-act="dl" data-id="${k}">⬇ Скачать</button><button class="btn sm ghost" data-act="cp" data-id="${k}">Скопировать</button></div>`).join('')}
        <p class="small muted">В seed.json уже лежат общие данные платформы — клиники, сотрудники, владельцы, питомцы. Они одинаковые у всей тройки, добавляй к ним свои.</p></div></section>
      <section class="sec"><h2>Как писать, чтобы понял ИИ-разработчик</h2><div class="grid2"><ol class="small">${C.aiRules.slice(0, 5).map(r => `<li>${r}</li>`).join('')}</ol><ol class="small" start="6">${C.aiRules.slice(5).map(r => `<li>${r}</li>`).join('')}</ol></div>
        ${F.examples.map(e => `<div class="badbood"><div class="b"><span class="lbl">Плохо</span>${esc(e.bad)}</div><div class="g"><span class="lbl">Хорошо</span>${esc(e.good)}</div></div>`).join('')}</section>
      <section class="sec"><h2>Проверка глазами ИИ-разработчика</h2><p class="muted">Последний шаг перед сдачей. Отдай пакет нейросети с этим промптом и закрой всё, что она найдёт.</p><pre id="aiprompt">${esc(C.aiPrompt)}</pre><div><button class="btn" data-act="copy-ai">Скопировать промпт</button></div></section>
      <section class="sec"><h2>Как будут оценивать</h2><div class="tbl"><table><thead><tr><th>Что смотрим</th><th>Баллы</th><th>Что значит «хорошо»</th></tr></thead><tbody>${C.rubricPublic.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td class="small">${c}</td></tr>`).join('')}<tr><th>Итого</th><th>100</th><th></th></tr></tbody></table></div>
        <p class="small muted">Отдельно наставник прогонит пакет через ИИ-разработчика. Если по пакету собирается работающая фича без вопросов к автору — это главный зачёт.</p></section>
      <section class="sec"><h2>Самопроверка перед сдачей</h2><div class="card">${C.checklist.map((t, i) => `<label class="check"><input type="checkbox" data-act="check" data-id="${i}" ${S.checks[i] ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div></section></div>`;
  }

  function pGuides() {
    return `<div class="page"><section class="sec"><h1>Шпаргалки</h1><p class="lead">Как написать каждый кусок спецификации. Примеры — из другой предметной области (прокат велосипедов «Педаль»): они показывают форму, а не ответ для «Лапы».</p>
      <div class="row">${C.guides.map(g => `<button class="btn sm ghost" data-act="guide" data-id="${g.id}">${esc(g.t)}</button>`).join('')}<button class="btn sm ghost" data-act="guide" data-id="ask">Как задавать вопросы</button><button class="btn sm ghost" data-act="guide" data-id="words">Словарик</button></div></section>
      ${C.guides.map(g => `<section class="card" id="g-${g.id}"><h2>${esc(g.t)}</h2><p class="simple">${g.simple}</p>
        <div class="grid2"><div><h4>Как писать</h4><ol class="small">${g.how.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div><div><h4>Частые ошибки</h4><ul class="small">${g.mistakes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>
        <h4>Пример</h4><pre>${esc(g.example)}</pre></section>`).join('')}
      <section class="card" id="g-ask"><h2>Как задавать вопросы</h2><p class="simple"><b>Как врач на приёме.</b> Он не спрашивает «дать вам таблетку?». Он спрашивает «где болит, когда началось, что пробовали».</p>
        <div class="tbl"><table><thead><tr><th>Тип</th><th>Зачем</th><th>Пример</th></tr></thead><tbody>${C.askGuide.map(([t, d, ex]) => `<tr><td><b>${esc(t)}</b></td><td class="small">${esc(d)}</td><td class="small muted">${esc(ex)}</td></tr>`).join('')}</tbody></table></div>
        <h4>Чего избегать</h4><ul class="small">${C.askAvoid.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
      <section class="card" id="g-words"><h2>Словарик</h2><div class="tbl"><table><thead><tr><th>Слово</th><th>Простыми словами</th><th>На что похоже</th></tr></thead><tbody>${C.glossary.map(([t, d, a]) => `<tr><td><b>${esc(t)}</b></td><td class="small">${esc(d)}</td><td class="small muted">${esc(a)}</td></tr>`).join('')}</tbody></table></div></section>
    </div>`;
  }

  // ---------- выгрузка ----------
  function exportMd() {
    const lines = [`# Блокнот интервью — ${F.title}`, '', `Аналитик: ${F.student}. Выгружено: ${new Date().toLocaleString('ru-RU')}.`, '',
      `Итоги: фактов ${Object.keys(S.nb).length}, интервью ${minutes()} мин, вопросов ${S.asked.length + S.free.length}, документов прочитано ${Object.keys(S.docsSeen).length} из ${F.docs.length}, подсказок открыто ${hintsUsed()}.`, ''];
    for (const [cat, label] of Object.entries(C.cats)) {
      const list = Object.keys(S.nb).filter(id => facts.get(id)?.cat === cat);
      if (!list.length) continue;
      lines.push(`## ${label}`, '');
      for (const id of list) lines.push(`- ${facts.get(id).text}  \n  _Источник: ${srcLabel(S.nb[id].src)}_`);
      lines.push('');
    }
    const dn = F.docs.filter(d => (S.docNotes[d.id] || '').trim());
    if (dn.length) { lines.push('## Заметки по документам', ''); for (const d of dn) lines.push(`### ${d.title}`, '', S.docNotes[d.id].trim(), ''); }
    for (const [k, t] of [['assum', 'Допущения'], ['open', 'Открытые вопросы'], ['notes', 'Прочие заметки']]) if (S[k].length) { lines.push(`## ${t}`, '', ...S[k].map(x => `- ${x}`), ''); }
    lines.push('## Журнал интервью', '');
    for (const p of F.people) {
      const qs = S.asked.map(id => qmap.get(id)).filter(q => q && q.who === p.id);
      const fr = S.free.filter(x => x.who === p.id);
      if (!qs.length && !fr.length) continue;
      lines.push(`### ${p.name} (${p.role}) — ${minutes(p.id)} мин`, '');
      for (const q of qs) lines.push(`- **${q.q}**  \n  ${q.a.replace(/<[^>]+>/g, '')}`);
      for (const x of fr) lines.push(`- **${x.q}** _(свой вопрос)_  \n  ${x.a}`);
      lines.push('');
    }
    const code = { c: F.code, f: Object.keys(S.nb), q: S.asked.length, fr: S.free.length, m: minutes(), h: S.hints, d: Object.keys(S.docsSeen).length };
    let enc = ''; try { enc = btoa(unescape(encodeURIComponent(JSON.stringify(code)))); } catch (e) {}
    lines.push('---', '', 'Код для наставника (вставить в ключ проверки):', '', '```', 'LAPA1:' + enc, '```', '');
    return lines.join('\n');
  }

  function fileText(k) {
    if (k === 'spec') return ['SPEC.md', C.specTemplate(F, META, F.seams)];
    if (k === 'openapi') return ['openapi.yaml', C.openapiTemplate(F, META)];
    if (k === 'seed') return ['seed.json', JSON.stringify(Object.assign({ _comment: 'Общие данные платформы — не менять id. Добавь ниже данные своей фичи.' }, C.seed, { [F.code]: {} }), null, 2)];
    if (k === 'readme') return ['README.md', C.readmeTemplate(F, META)];
  }

  let dlCap;
  async function saveFile(name, text) {
    if (window.claude && dlCap === undefined) { try { dlCap = await window.claude.use('downloads'); } catch (e) { dlCap = null; } }
    if (dlCap) {
      try { await dlCap.save({ filename: name, data: text }); toast('Сохранено: ' + name); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { copy(text); }
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Скопировано'); } catch (e2) { toast('Не получилось скопировать — выдели текст вручную'); }
      ta.remove();
    }
  }
  let tt;
  function toast(t) {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2600);
  }

  // ---------- свой вопрос через Claude (только в артефакте) ----------
  let sample = null;
  if (window.claude && window.claude.use) window.claude.use('sample').then(s => { sample = s; showFree(); }).catch(() => {});
  function showFree() { const b = $('#free-box'); if (b && sample) b.hidden = false; }

  async function askFree(pid) {
    const ta = $('#free-q'), st = $('#free-st'), btn = document.querySelector('[data-act="free"]');
    const text = (ta.value || '').trim(); if (!text || !sample) return;
    const p = people.get(pid);
    const qs = F.questions.filter(q => q.who === pid && (q.requiresFacts || []).every(inNb));
    const known = [...new Set(qs.flatMap(q => q.facts))].map(id => `${id}: ${facts.get(id).text}`).join('\n');
    const examples = qs.filter(q => q.kind === 'good').slice(0, 5).map(q => `Вопрос: ${q.q}\nОтвет: ${q.a.replace(/<[^>]+>/g, '')}`).join('\n\n');
    const prompt = `Ты играешь роль персонажа в учебном симуляторе интервью для начинающего системного аналитика. Продукт — «Лапа», сеть ветеринарных клиник в Нижнем Новгороде.
Персонаж: ${p.name}, ${p.role}. Как начинает разговор: «${p.hello.replace(/<[^>]+>/g, '')}».

Персонаж знает ТОЛЬКО эти факты:
${known}

Примеры того, как персонаж отвечает:
${examples}

Правила ответа:
- По-русски, от первого лица, 2–5 предложений, разговорно, в характере. Без терминов аналитика («бизнес-правило», «статус», «эндпоинт», «требование»).
- Опирайся только на факты из списка, не выдумывай новых чисел и правил. Если вопрос о том, чего в фактах нет, честно скажи, что не знаешь или не задумывался(-ась), и предложи решить это аналитику или спросить другого человека.
- Отвечай только на то, о чём спросили, не пересказывай всё подряд.
- Если спрашивают про решение (какая кнопка, какая база, какой экран), скажи, что тебе это неважно, и расскажи о своей проблеме, если она есть в фактах.
- Если вопрос не по делу или некорректный — вежливо верни разговор к работе.

Верни только JSON: {"answer": "текст ответа", "facts": ["ID фактов, на которые реально опирается ответ"]}.

Вопрос аналитика: ${text}`;
    btn.disabled = true; st.textContent = `${p.name.split(' ')[0]} думает…`;
    try {
      const r = await sample.json(prompt, { cache: false });
      const ans = String(r && r.answer || '').trim();
      if (!ans) throw { code: 'invalid_json' };
      const fs = (Array.isArray(r.facts) ? r.facts : []).map(String).filter(id => facts.has(id) && qs.some(q => q.facts.includes(id)));
      S.free.push({ who: pid, q: text, a: ans, facts: fs }); save(); render();
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { sample = null; const b = $('#free-box'); if (b) b.hidden = true; return; }
      st.textContent = code === 'rate_limited' ? 'Слишком много вопросов подряд — попробуй через минуту.' : 'Ответ не пришёл. Попробуй переформулировать вопрос.';
      btn.disabled = false;
    }
  }

  // ---------- рендер и события ----------
  const PAGES = { start: pStart, product: pProduct, brief: pBrief, docs: pDocs, interview: pInterview, notebook: pNotebook, seams: pSeams, guides: pGuides, pack: pPack };
  function render() {
    const app = $('#app');
    const nbCount = Object.keys(S.nb).length;
    app.innerHTML = `<header class="top"><div class="top-in">
      <div class="brand">${logo}<span class="wm">AMP<i>.</i></span><span class="sep">/</span><span class="prod">Лапа · тестовое задание</span><span class="sp"></span>
        <span class="who"><span class="dot"></span>${esc(F.student)} · ${esc(F.short)}</span>
        <button class="icon-btn" data-act="theme" title="Светлая или тёмная тема" aria-label="Переключить тему">◐</button></div>
      <nav class="tabs" role="tablist">${TABS.map(([id, t]) => `<button class="tab" role="tab" data-act="tab" data-id="${id}" aria-selected="${S.tab === id}">${t}${id === 'notebook' && nbCount ? `<span class="n">${nbCount}</span>` : ''}</button>`).join('')}</nav>
    </div></header><main id="main">${(PAGES[S.tab] || pStart)()}</main>
    <footer class="foot">Продукт «Лапа» и все люди в задании выдуманы для учебной задачи. Прогресс хранится только в этом браузере. Версия ${esc(C.version)}.</footer>`;
    showFree();
    save();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    switch (act) {
      case 'tab': S.tab = id; render(); window.scrollTo(0, 0); break;
      case 'theme': {
        const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        S.theme = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', S.theme); save(); break;
      }
      case 'hint': S.hints[id] = (S.hints[id] || 0) + 1; S.openStage = id; render(); break;
      case 'guide': { S.tab = 'guides'; render(); const g = document.getElementById('g-' + id); if (g) g.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); break; }
      case 'doc': S.doc = id; render(); break;
      case 'person': S.person = id; render(); break;
      case 'ask': {
        const q = qmap.get(id); if (!q || !available(q)) return;
        const before = new Set(F.questions.filter(available).map(x => x.id));
        S.asked.push(id); S.person = q.who;
        render();
        const fresh = F.questions.filter(x => available(x) && !before.has(x.id) && x.id !== id);
        if (fresh.length) toast(fresh.length === 1 ? 'Появился уточняющий вопрос' : `Появилось уточняющих вопросов: ${fresh.length}`);
        const blocks = document.querySelectorAll('.log .qa'); if (blocks.length) blocks[blocks.length - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        break;
      }
      case 'add': { const y = window.scrollY; addFact(id, el.dataset.src); render(); window.scrollTo(0, y); break; }
      case 'unfact': delete S.nb[id]; render(); break;
      case 'free': askFree(id); break;
      case 'export-dl': saveFile('interview-notes.md', exportMd()); break;
      case 'export-copy': copy(exportMd()); break;
      case 'dl': { const [n, t] = fileText(id); saveFile(n, t); break; }
      case 'cp': { const [, t] = fileText(id); copy(t); break; }
      case 'copy-ai': copy(C.aiPrompt); break;
      case 'copy-proto': copy(protocol()); break;
      default:
        if (act.startsWith('add-')) { const k = act.slice(4); const v = ($('#in-' + k).value || '').trim(); if (v) { S[k].push(v); render(); } }
        else if (act.startsWith('del-')) { const k = act.slice(4); S[k].splice(+id, 1); render(); }
    }
  });
  document.addEventListener('change', e => {
    const el = e.target; const act = el.dataset && el.dataset.act; if (!act) return;
    if (act === 'stage') { S.stages[el.dataset.id] = el.checked; S.openStage = el.dataset.id; render(); }
    if (act === 'check') { S.checks[el.dataset.id] = el.checked; save(); }
    if (act === 'ready') { (S.ready = S.ready || {})[el.dataset.id] = el.checked; save(); }
    if (act === 'agree') { S.agree[el.dataset.id] = el.checked; save(); }
  });
  document.addEventListener('input', e => {
    const el = e.target; if (el.dataset && el.dataset.act === 'docnote') { S.docNotes[el.dataset.id] = el.value; save(); }
  });
  document.addEventListener('toggle', e => {
    const d = e.target; if (d.classList && d.classList.contains('stage') && d.open) { S.openStage = d.dataset.stage; save(); }
  }, true);

  render();
})();
</script>
</body>
</html>
