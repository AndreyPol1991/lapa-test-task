<script>window.FEATURE = {"code":"medcard","student":"Олеся","studentFile":"olesya","title":"Электронная медкарта питомца","short":"Медкарта","prefix":"MC","tagline":"одна карта питомца на всю сеть — для врача и для владельца","icon":"🩺","why":["Медкарта — сердце «Лапы». Здесь врач проводит каждый приём, здесь живёт история питомца, отсюда уходят услуги в счёт и напоминания о прививках. Если карта будет неудобной — врачи вернутся в Word. Если неточной — сеть проиграет первый же спор с владельцем.","Сейчас у каждой клиники своя база: «ВетБаза» в трёх клиниках, Excel и бумага в двух. 18 % питомцев за год ходили в две клиники сети и больше — и врач не видит, что было у коллег, назначает анализы повторно. Ветпаспорт с прививками — бумажный, у владельца, и его теряют. А «что сделал на приёме» врач пишет на бумажке — по сверке около 4 % услуг и препаратов до чека не доходит.","Твоя фича стоит посередине продукта: запись (Эльнара) приводит пациента к врачу, счёт (Никита) получает из визита услуги и препараты. Ошибёшься на стыках — владелец получит два одинаковых напоминания, а бухгалтерия — потерянные деньги. Поэтому здесь важно не только выслушать врачей, но и договориться с соседями."],"brief":{"from":"marina","subject":"Медкарта — одна на всех","paragraphs":["Олеся, добрый день! Мне сказали, медкарта — на вас. Коротко, в чём беда: у нас пять клиник и пять разных «карт». Где-то «ВетБаза», где-то Word, где-то тетрадка. Животное приходит в Сормово, а там понятия не имеют, что неделю назад его смотрели на Ванеева.","Хочу одну карту питомца на всю сеть. Чтобы врач открыл — и всё видно. Врачи жалуются, что сидят в компьютере дольше, чем смотрят животное, так что сделайте удобно, как в нормальных клиниках, — шаблоны там какие-нибудь, чтобы не печатать одно и то же. Ну и диагнозы чтобы были нормальные, а не кто во что горазд.","Владельцы пусть видят в приложении всё, что надо: прививки, анализы, что назначили. Чтобы не теряли ветпаспорта и не звонили на ресепшен «а когда нам прививка».","И главное для меня как для директора: всё, что врач сделал на приёме, должно попадать в счёт. Сейчас мы теряем на бумажках деньги. Это вы с Никитой обсудите, он делает счета. Юриста нашего тоже послушайте — он вечно чего-то опасается, но иногда по делу.","Запускаемся в марте на Ванеева и в «Лапе-24». Подробности — у Нины Ивановны, Артёма, Юли и Глеба. Пишите коротко, я на связи. М. С."]},"zone":["Визит (приём): из чего состоит, как начинается и чем заканчивается","Диагнозы, назначения, вес и прививки — с историей","Кто что видит в карте: сотрудники разных ролей, владелец, его семья","Исправления в медицинских записях и юридическая сторона","Файлы, операции и согласия владельца","Старые данные из «ВетБазы»","Стыки с записью (Эльнара) и счётом (Никита)"],"facts":[{"id":"MC-01","cat":"goal","crit":true,"text":"Цель: одна карта питомца на всю сеть (5 клиник). Сейчас у каждой клиники своя база («ВетБаза» VAN, L24, SRM — отдельно; AVT, KST — Excel и бумага). 18 % питомцев ходят в 2+ клиники; врач не видит чужие приёмы → повторные анализы."},{"id":"MC-02","cat":"data","crit":true,"text":"Визит = жалобы и анамнез; осмотр (вес, температура, пульс, частота дыхания, слизистые, свободный текст); диагноз; назначения (препарат, доза, способ, кратность, длительность); рекомендации; следующий визит (через сколько дней и зачем)."},{"id":"MC-03","cat":"scenario","text":"Шаблоны осмотра под тип приёма: вакцинация — 4 поля, первичный — полный осмотр. Сейчас запись в Word ~10 мин, цель — 3–5 мин. Последние назначения можно скопировать из прошлого визита."},{"id":"MC-04","cat":"rule","conflict":"MC-05","text":"Марина: диагноз — только из справочника сети (~400 диагнозов, ведёт главврач), иначе нет аналитики."},{"id":"MC-05","cat":"rule","conflict":"MC-04","text":"Нина: справочник всего не покрывает, искать в списке из 400 строк не будет — нужен свободный текст диагноза."},{"id":"MC-06","cat":"rule","crit":true,"text":"Решение Марины: предварительный диагноз — свободным текстом. Окончательный при закрытии визита — обязательно из справочника (поиск по первым буквам) + уточнение текстом. Нет подходящего — код «Другое» + текст; главврач раз в месяц разбирает «Другое»."},{"id":"MC-07","cat":"data","crit":true,"text":"Вес — с историей и графиком, от веса считаются дозы. Вес вносится на каждом визите; ассистент может внести вес и температуру до врача."},{"id":"MC-08","cat":"rule","crit":true,"text":"Вакцинация: препарат, серия, дата, действует до, врач, клиника. По сроку следующей — напоминание владельцу за 14 и за 3 дня со ссылкой на запись (стык S1)."},{"id":"MC-09","cat":"scenario","text":"Электронная выписка о вакцинациях в PDF для поездок и выставок, с QR-кодом: по нему на сайте «Лапы» проверяют подлинность."},{"id":"MC-10","cat":"rule","conflict":"MC-11","text":"Нина: хочет исправлять свою запись визита в любой момент — «опечаталась в дозе, а исправить не могу»."},{"id":"MC-11","cat":"legal","conflict":"MC-10","text":"Юрист: медзапись — документ для споров с владельцами; после закрытия менять нельзя."},{"id":"MC-12","cat":"status","crit":true,"text":"Решение юриста: врач закрывает (подписывает) визит. 24 ч после закрытия автор может исправить запись — каждая версия сохраняется (кто, когда, что было). После 24 ч — только «дополнение» с датой и автором, исходный текст не меняется."},{"id":"MC-13","cat":"role","crit":true,"text":"Доступ: врач — вся карта питомца из любой клиники сети; ассистент — вес, температура, назначения и их выполнение; администратор — только список визитов и вакцинаций без медицинских подробностей; управляющий — как администратор."},{"id":"MC-14","cat":"role","crit":true,"text":"Владелец в приложении видит визиты (диагноз, назначения, рекомендации), вакцинации и файлы анализов. НЕ видит служебную заметку врача («агрессивный владелец», «подозрение на жестокое обращение»)."},{"id":"MC-15","cat":"data","crit":true,"text":"Блок «Важно» вверху карты: аллергии, хронические заболевания, поведение («кусается — нужна муфта»). Виден всем сотрудникам, включая администратора."},{"id":"MC-16","cat":"role","text":"Основной владелец может дать «доверенному лицу» (муж, мама) доступ — смотреть карту и записывать питомца — и отозвать его."},{"id":"MC-17","cat":"scenario","crit":true,"text":"Передача питомца новому владельцу (заводчик продал котёнка): история вакцинаций и визитов переходит, контакты и служебные данные прежнего владельца новому не видны. Передаёт администратор по заявлению обоих или основной владелец в приложении."},{"id":"MC-18","cat":"scenario","text":"Заводчик (9 кошек): один экран — все его питомцы с ближайшими вакцинациями."},{"id":"MC-19","cat":"data","crit":true,"text":"Файлы к визиту: PDF «ВетЛаб» (приходят на почту клиники), фото, заключения УЗИ/рентгена (JPG). До 20 МБ на файл. DICOM остаётся на аппаратах — в карте только заключение и картинки. API «ВетЛаб» — 2027, не в этой версии."},{"id":"MC-20","cat":"rule","crit":true,"text":"Операция: протокол, анестезия (препарат, доза, время начала и окончания), согласие владельца на операцию и анестезию (фото/скан бумажного или подпись в приложении). Без согласия операцию в карте начать нельзя."},{"id":"MC-21","cat":"scope","text":"Стационар (лист назначений по часам, отметки выполнения) — Марина: в MVP не делаем, только визиты; стационар — этап 2. Юлия очень хочет."},{"id":"MC-22","cat":"seam","crit":true,"text":"Следующий визит: врач указывает «повторный через N дней» или «вакцинация до даты» → владельцу уходит предложение записаться (стык S1, medcard.followup.planned)."},{"id":"MC-23","cat":"scenario","crit":true,"text":"Визит создаётся при начале приёма по записи. Экстренный пациент без записи (L24 ночью) — визит создаётся вручную, без записи."},{"id":"MC-24","cat":"seam","crit":true,"text":"Услуги и препараты врач отмечает в визите из каталога (каталог — у счёта, Никита); при закрытии визита они уходят в счёт (стык S2). Сейчас бумажка → теряется 4 %."},{"id":"MC-25","cat":"migration","text":"Миграция: 3 базы «ВетБазы», дубли питомцев между клиниками. Марина: вакцинации — за всё время, визиты — за последние 2 года. Глеб: дубли искать по телефону владельца + кличке + виду; спорные разбирает администратор вручную."},{"id":"MC-26","cat":"scenario","text":"Поиск питомца: по кличке, телефону владельца, номеру чипа (15 цифр)."},{"id":"MC-27","cat":"legal","crit":true,"text":"Медзаписи хранятся не меньше 5 лет после последнего визита. Владелец удаляет ПДн (152-ФЗ) → карта питомца остаётся, но обезличивается (связь с владельцем убирается)."},{"id":"MC-28","cat":"legal","text":"Журнал просмотров: кто и когда открывал карту питомца — для споров."},{"id":"MC-29","cat":"scenario","text":"Нет интернета (KST) → врач пишет на бумаге, потом вносит визит задним числом с отметкой «внесено позже» и фактическим временем приёма."},{"id":"MC-30","cat":"nfr","text":"Карта открывается у врача не дольше 2 с; в пик одновременно работают ~40 врачей."},{"id":"MC-31","cat":"scenario","text":"Выписка после приёма: владелец сразу получает её в приложении / на email; если просит — администратор печатает (Пётр Ильич хочет бумагу)."},{"id":"MC-32","cat":"scope","text":"Не входит: стационар, дневник владельца (вес дома, фото, симптомы), интеграция с «ВетЛаб», телемедицина."}],"people":[{"id":"marina","name":"Марина Сергеевна Белова","role":"генеральный директор и сооснователь сети, бывший ветврач; заказчик продукта","emoji":"👩‍💼","hello":"Олеся, здравствуйте! У меня минут двадцать до планёрки, давайте по делу. Мне нужна одна карта питомца на всю сеть — а не пять огородов, как сейчас."},{"id":"nina","name":"Нина Ивановна Орлова","role":"врач-терапевт «Лапы на Ванеева», 25 лет стажа","emoji":"👩‍⚕️","hello":"Садитесь, только недолго — у меня в коридоре такса с ушами. Сразу предупреждаю: я не люблю компьютер, я люблю животных. Печатать — не моё."},{"id":"artem","name":"Артём Ковалёв","role":"хирург, заведующий хирургией «Лапы-24»","emoji":"🧑‍⚕️","hello":"Привет! Наконец-то кто-то занялся картой. Я за то, чтобы всё было в системе — особенно протоколы и согласия. У меня полчаса между операциями, спрашивай."},{"id":"yulia","name":"Юлия","role":"ассистент врача, стационар «Лапы-24»","emoji":"💉","hello":"Ой, проходите! Можно я буду говорить и капельницу ставить? Руки заняты, а голова свободна."},{"id":"lawyer","name":"Алексей Петрович","role":"юрист сети (аутсорс)","emoji":"⚖️","hello":"Добрый день. Сразу оговорюсь: всё, что попадёт в медкарту, однажды может оказаться в претензии или в суде. Давайте исходить из этого."},{"id":"gleb","name":"Глеб","role":"системный администратор, единственный ИТ-специалист сети","emoji":"🛠️","hello":"Ну, давай. Только если опять про «облака» — у нас в Кстове интернет как погода. Что хотела спросить?"},{"id":"ksenia","name":"Ксения","role":"владелица кошки Буси (12 лет, хроническая почечная недостаточность)","emoji":"🐈","hello":"Здравствуйте! Я в обеденный перерыв, с телефона, так что если пропаду — значит, начальник. Мы с Бусей у вас почти постоянные клиенты."},{"id":"dmitry","name":"Дмитрий","role":"заводчик мейн-кунов, ИП, 9 кошек","emoji":"🦁","hello":"Добрый день. У меня девять мейн-кунов, выставки и котята на продажу. Так что карта для меня — не про «удобно», а про деньги и репутацию питомника."}],"questions":[{"id":"marina-1","who":"marina","topic":"Как сейчас","kind":"good","min":4,"facts":["MC-01"],"q":"Что сейчас не так с медкартами и зачем сети одна карта?","a":"Да всё не так! У каждой клиники своя «ВетБаза», они друг про друга не знают, а Автозавод и Кстово вообще в Excel и тетрадках. Я посмотрела: 18 % питомцев за год были в двух наших клиниках и больше. Кошка сдала кровь на Ванеева, через неделю пришла в Сормово — там не видят, и снова кровь. Хозяин платит дважды, животное колют дважды, а мы выглядим как пять разных контор."},{"id":"marina-2","who":"marina","topic":"Правила","kind":"good","min":4,"facts":["MC-04"],"q":"Как врачи сейчас записывают диагноз и что вам нужно от этих записей?","a":"Каждый пишет как хочет: «ХПН», «хроническая почечная», «почки»… Я хочу знать, сколько у нас кошек с почками, сколько с дерматитами, — и не могу, потому что это сорок вариантов написания. Наш главврач ведёт справочник диагнозов, там около 400 позиций. Диагноз — только из справочника, иначе никакой аналитики не будет."},{"id":"marina-3","who":"marina","topic":"Деньги","kind":"good","min":4,"facts":["MC-24"],"q":"Как сейчас то, что врач сделал на приёме, попадает в чек?","a":"Через бумажку! Врач пишет на листочке «что сделал», администратор на кассе набирает вручную. По сверке около 4 % услуг и препаратов в чек не попадает — укол сделали, а не посчитали. Хочу, чтобы врач прямо в карте отмечал услуги и препараты из нашего каталога, и это само уходило в счёт. Каталог — это часть про счёт, её делает Никита, с ним и договаривайтесь."},{"id":"marina-4","who":"marina","topic":"Границы","kind":"good","min":3,"facts":["MC-32","MC-21"],"q":"Что точно не нужно делать в первой версии медкарты?","a":"Стационар — не сейчас. Юля мне все уши прожужжала про лист назначений по часам, я понимаю, но это второй этап, сначала приёмы. Дневник владельца — чтобы хозяин сам вписывал вес, фото, симптомы — тоже потом. С «ВетЛабом» напрямую стыковаться — в 2027-м, пока пусть врачи прикрепляют их PDF. И никакой телемедицины, видеоконсультации — это вообще 2028."},{"id":"marina-5","who":"marina","topic":"Уточнение","kind":"good","min":3,"facts":["MC-25"],"requires":["marina-1"],"q":"Вы сказали про старые базы. Какую историю из них нужно увидеть в новой карте?","a":"Прививки — за всё время: это и владельцам важно, и для выставок, и бешенство никто не отменял. Визиты — за последние два года, глубже всё равно никто не смотрит, а возни много. Как склеивать одного и того же кота из трёх баз — это к Глебу, он в «ВетБазе» каждый винтик знает."},{"id":"marina-6","who":"marina","topic":"Решение спора","kind":"conflict","min":5,"facts":["MC-06"],"requiresFacts":["MC-04","MC-05"],"q":"Нина Ивановна против диагноза только из справочника — говорит, не будет искать в списке из 400 строк. Как быть?","a":"Ох, Нина Ивановна… Ладно, давайте так. Пока идёт приём, предварительный диагноз пусть пишет как хочет, свободным текстом. А когда закрывает визит — окончательный диагноз обязательно из справочника, но с поиском по первым буквам, чтобы не листать 400 строк, и рядом можно уточнить своими словами. Нет подходящего — ставит «Другое» и пишет текстом; главврач раз в месяц разбирает эти «Другое» и пополняет справочник. Так и запишите."},{"id":"marina-7","who":"marina","topic":"Прививки","kind":"good","min":4,"facts":["MC-08"],"q":"Что для вас важно в прививках?","a":"Прививки — это и здоровье, и деньги, и бешенство, в конце концов. Сейчас всё в бумажном ветпаспорте у хозяина, а он его теряет — и мы не знаем, чем и когда прививали. Мне нужно видеть: какой препарат, серия, дата, до какого числа действует, кто прививал и в какой клинике. И пусть владельцу заранее приходит напоминание, когда подходит срок, — за две недели и за три дня, со ссылкой, чтобы сразу записаться."},{"id":"marina-8","who":"marina","topic":"Как сделать","kind":"solution","min":2,"facts":[],"q":"Медкарту делать отдельным приложением или внутри общего? И какие цвета взять?","a":"Да мне всё равно, честное слово. Пусть будет как удобнее врачу на приёме и хозяину в телефоне. Вы меня лучше спросите, что мне от карты нужно, — а цвета дизайнер выберет."},{"id":"marina-9","who":"marina","topic":"Доступ","kind":"good","min":4,"facts":["MC-13"],"q":"Кто из сотрудников что должен видеть в карте?","a":"Врач — всю карту, из любой клиники сети, ради этого всё и затеваем. Ассистенту нужно взвесить, температуру померить, посмотреть назначения и отметить, что сделал. Администратору на ресепшене диагнозы ни к чему — ему список визитов и прививок, чтобы записать и ответить на звонок. Управляющим — так же, как администратору: они клиникой управляют, а не лечат. Алексей Петрович на этом, кстати, очень настаивал."},{"id":"marina-10","who":"marina","topic":"Сроки","kind":"good","min":2,"facts":[],"q":"Когда и где запускаемся?","a":"Пилот — в марте 2027 на Ванеева и в «Лапе-24». Там «ВетБаза», люди привыкли к компьютеру, и поток большой — сразу увидим, где болит. К июню — все пять клиник, включая Сормово, Автозавод и Кстово. Кстово меня, честно, пугает: там интернет то есть, то нет."},{"id":"nina-1","who":"nina","topic":"Как сейчас","kind":"good","min":6,"facts":["MC-02"],"q":"Расскажите, как проходит обычный приём: что вы делаете и что записываете?","a":"Захожу, хозяин рассказывает, что случилось: жалобы, что ели, чем болели раньше. Потом смотрю: вес, температура, пульс, дыхание считаю, слизистые — розовые, бледные, — и всё, что увидела, своими словами. Потом диагноз. Потом назначения: какой препарат, сколько, как давать, сколько раз в день и сколько дней. Рекомендации — корм, режим. И в конце: «Придёте через десять дней, проверим кровь». Если хозяин при записи написал, что беспокоит, — хорошо бы это сразу видеть, а не переспрашивать."},{"id":"nina-2","who":"nina","topic":"Как сейчас","kind":"good","min":4,"facts":["MC-03"],"requires":["nina-1"],"q":"Сколько времени уходит на записи и что в этом самое неудобное?","a":"Минут десять на каждый приём сижу в Word — у меня там бланк, потом ещё в «ВетБазу» копирую, а в коридоре очередь. На прививку мне нужно-то четыре строчки, а я листаю весь бланк первичного. И одно и то же печатаю: у хроников назначения из раза в раз почти те же — я бы взяла из прошлого приёма и поправила. Если на всё уйдёт минуты три-пять — я ваша."},{"id":"nina-3","who":"nina","topic":"Правила","kind":"good","min":4,"facts":["MC-05"],"q":"Как вы формулируете диагноз в записи?","a":"Как вижу, так и пишу. Бывает, сразу не ясно — пишу «подозрение на панкреатит, исключить инородное тело». Марина Сергеевна хочет, чтобы всё было из списка, я этот список видела — четыреста строк! Я не буду искать в списке из 400 строк, пока кот на столе. И половины того, что я вижу, там всё равно нет. Мне нужен свободный текст."},{"id":"nina-4","who":"nina","topic":"Исключения","kind":"good","min":4,"facts":["MC-10"],"q":"Бывало, что вы находили ошибку в своей записи уже после приёма? Что делали?","a":"Да сто раз. На прошлой неделе написала 0,5 вместо 0,05 — опечаталась, хорошо, хозяйка переспросила по телефону. В Word я исправила, а в «ВетБазе» закрытый приём не исправишь — только Глеба звать. Я хочу исправлять свою запись в любой момент: я же врач, это моя запись."},{"id":"nina-5","who":"nina","topic":"Данные","kind":"good","min":4,"facts":["MC-15"],"q":"Что вам важно увидеть первым, когда открываете карту животного, которое видите впервые?","a":"Чем опасен — для меня и для него. Аллергия на препарат, хроника — почки, сердце, диабет. И поведение: «кусается — нужна муфта», «брать только в полотенце». Сейчас у нас это на бумажной карте красным маркером сверху. И пусть это видят все — и администратор, чтобы предупредил, и Юля, которая будет держать."},{"id":"nina-6","who":"nina","topic":"Владелец","kind":"good","min":3,"facts":["MC-31"],"q":"Что владелец получает на руки после приёма?","a":"Распечатку — что нашли, что назначили, как давать. Молодые её фотографируют и выбрасывают, а потом звонят: «а сколько капать?». Пётр Ильич, хозяин Графа, наоборот, бумагу бережёт, у него папка. Хорошо бы, чтобы выписка сразу была у хозяина в телефоне или на почте, а кто хочет бумагу — пусть администратор распечатает."},{"id":"nina-7","who":"nina","topic":"Уточнение","kind":"good","min":4,"facts":["MC-14"],"requires":["nina-6"],"q":"А всё, что вы пишете в карте, можно показывать владельцу?","a":"Нет, конечно! Я иногда пишу для коллег: «владелец агрессивный, говорить при свидетелях» или «подозрение на жестокое обращение — переломы разной давности». Если хозяин это прочитает — скандал, а в худшем случае животное больше не приведут. Диагноз, назначения, рекомендации, прививки, анализы — пусть видят. А такие пометки — только для врачей."},{"id":"nina-8","who":"nina","topic":"Следующий визит","kind":"good","min":3,"facts":["MC-22"],"q":"Как вы сейчас договариваетесь с владельцем о следующем приёме?","a":"Говорю устно: «Через десять дней на повторный» или «Прививку до такого-то числа». Половина забывает. Потом приходят через два месяца, когда уже всё плохо. Я бы отметила в карте «повторный через столько-то дней» или «прививка до даты» — и чтобы хозяину пришло предложение записаться. Сама обзванивать не буду, у меня приём."},{"id":"nina-9","who":"nina","topic":"Файлы","kind":"good","min":3,"facts":["MC-19"],"q":"Где сейчас хранятся анализы, заключения УЗИ, снимки?","a":"Анализы из «ВетЛаба» приходят PDF-кой на общую почту клиники, администратор распечатывает и вкладывает в бумажную карту — или не вкладывает. Заключения УЗИ и рентгена — картинки. Иногда фотографирую на телефон опухоль, чтобы через месяц сравнить. Хочу, чтобы всё это лежало прямо в приёме, к которому относится."},{"id":"nina-10","who":"nina","topic":"Как сделать","kind":"weak","min":2,"facts":[],"q":"Вам ведь будет удобнее, если всё будет в компьютере?","a":"Ну… удобнее, наверное. Если не будет тормозить. Вы лучше спросите, что мне мешает сейчас, — я вам больше расскажу."},{"id":"artem-1","who":"artem","topic":"Операции","kind":"good","min":5,"facts":["MC-20"],"q":"Как сейчас оформляется операция — от решения до момента, когда животное проснулось?","a":"Сначала консультация, потом смета и согласие владельца на операцию и наркоз — на бумажном бланке, с подписью. Без подписи я даже в операционную не захожу, это железно. Потом протокол: что делали, что нашли. Отдельно наркоз — препарат, доза, время начала и окончания, тот, кто ведёт наркоз, пишет минута в минуту. Сейчас всё это в папке, а папка — в шкафу в L24. Хочу, чтобы протокол и скан согласия жили в карте, а владелец мог бы и в приложении подписать."},{"id":"artem-2","who":"artem","topic":"Уточнение","kind":"good","min":4,"facts":["MC-24"],"requires":["artem-1"],"q":"А как препараты и расходники с операции попадают в счёт?","a":"Больная тема. На наркозе пишут «пропофол 4,5 мл», а администратор потом ищет, как это на кассе называется — во флаконах или в миллилитрах. Половину не находит. Смету я пишу «от — до», владелец подписывает её вместе с согласием; если по ходу выходим за верхнюю границу больше чем на 10 % — звоню владельцу. Я бы хотел, чтобы всё, что я отметил в операции, было из того же списка, что на кассе, с той же единицей, и уходило в счёт без переписывания."},{"id":"artem-3","who":"artem","topic":"Данные","kind":"good","min":3,"facts":["MC-07","MC-15"],"q":"Что тебе нужно увидеть в карте перед операцией?","a":"Свежий вес — наркоз считаю на килограмм, вес полугодовой давности для меня ничего не значит. Аллергии и хроника — сердце, почки: это вопрос, проснётся или нет. И что было раньше: оперировали ли, как перенёс наркоз — даже если это было в Сормове. Сейчас я узнаю это от хозяина, а хозяин путает."},{"id":"yulia-1","who":"yulia","topic":"Как сейчас","kind":"good","min":4,"facts":["MC-07"],"q":"Что вы делаете с животным до врача и после?","a":"Взвешиваю, меряю температуру — пока доктор с хозяином говорит, я уже кота на весы. Вес нужен всегда: от него доза, а у таких, как Буся, каждый грамм на счету — худеет, значит, хуже. Сейчас пишу вес на листочке, доктор переписывает, и иногда переписывает не туда. Хочу вносить вес и температуру сама, до врача, и видеть, как вес менялся, — графиком, а не листать."},{"id":"yulia-2","who":"yulia","topic":"Стационар","kind":"good","min":3,"facts":["MC-21"],"q":"Как сейчас ведётся стационар?","a":"На бумаге: лист назначений на каждого, по часам — что колоть, что капать, а я ставлю галочку и инициалы. Четырнадцать мест, ночью людей мало, листки путаются. Я очень-очень хочу это в системе. Но Марина Сергеевна сказала: стационар — второй этап, сначала приёмы. Обидно, но понимаю."},{"id":"yulia-3","who":"yulia","topic":"Исключения","kind":"good","min":4,"facts":["MC-23"],"q":"Как оформляете пациента, который приехал ночью без записи?","a":"Ночью в L24 никто не записывается — привезли собаку после машины в два часа ночи, и мы бегом. Сначала спасаем, потом бумажки. Сейчас доктор заводит приём в «ВетБазе» сам, без всякой записи. Днём проще: пришёл по записи — начали приём. Главное, чтобы система не требовала запись, когда на столе кровь."},{"id":"yulia-4","who":"yulia","topic":"Поиск","kind":"good","min":3,"facts":["MC-26"],"q":"Как вы находите карту нужного животного?","a":"По-разному. Хозяин говорит «Барсик» — а Барсиков у нас сотня. Тогда по телефону хозяина. Если найдёныш или хозяин в панике и номер не помнит — сканером читаем чип, там пятнадцать цифр. Вот по этим трём — кличка, телефон, чип — и надо искать."},{"id":"yulia-5","who":"yulia","topic":"Уточнение","kind":"good","min":3,"facts":["MC-13","MC-15"],"requires":["yulia-1"],"q":"А что из карты вам нужно видеть, а что — нет?","a":"Мне нужно: вес, температура, что назначили — и отметить, что я сделала: укол, капельницу. Диагнозы и рассуждения доктора мне не обязательно, это пусть доктора. А вот «кусается, нужна муфта» — это мне обязательно, это мои руки."},{"id":"yulia-6","who":"yulia","topic":"Как сделать","kind":"solution","min":2,"facts":[],"q":"Сделать вам большую зелёную кнопку «Взвесить»?","a":"Да хоть розовую! Мне не кнопка нужна. Мне главное — чтобы я вес внесла один раз и его потом никто руками не переписывал."},{"id":"yulia-7","who":"yulia","topic":"Исключения","kind":"good","min":3,"facts":[],"q":"Если вы взвесили кота до врача, а врач потом перевесил и вышло по-другому — какой вес правильный?","a":"Ой… Бывает: кот на весах вертится, я пишу 4,1, доктор потом взвешивает с рук — выходит 4,3. Какой правильный — не знаю, честно. Наверное, последний? Но это вы решите, как лучше, а я буду делать, как скажут."},{"id":"lawyer-1","who":"lawyer","topic":"Закон","kind":"good","min":4,"facts":["MC-11"],"q":"Почему для вас медицинская запись — особый документ?","a":"Потому что в споре с владельцем это наше главное доказательство. «Вы залечили мою собаку» — и мы открываем карту: что увидели, что назначили, в какой дозе. Если запись можно поправить задним числом, она перестаёт быть доказательством — нам скажут, что мы её подогнали. Поэтому моя позиция простая: закрытую запись менять нельзя."},{"id":"lawyer-2","who":"lawyer","topic":"Сроки","kind":"good","min":4,"facts":["MC-27"],"q":"Сколько хранить медицинские записи и что делать, если владелец просит удалить свои данные?","a":"Медицинские записи — не меньше пяти лет после последнего визита питомца. Персональные данные — другое дело: по закону о персональных данных владелец вправе потребовать их удалить. Но карта — это история животного, а не владельца. Её мы сохраняем, только убираем связь с человеком — чтобы нельзя было понять, чей это питомец."},{"id":"lawyer-3","who":"lawyer","topic":"Доступ","kind":"good","min":3,"facts":["MC-13"],"q":"Кто, на ваш взгляд, может смотреть медкарту в клинике?","a":"Врач — да, всю, и из любой клиники: животное лечит сеть, а не один кабинет. Ассистенту — то, что нужно для работы руками: вес, температура, назначения, отметки о выполнении. Администратору и управляющему медицинские подробности не нужны — список визитов и прививок, не более. Чем меньше людей видят диагноз, тем меньше у меня работы."},{"id":"lawyer-4","who":"lawyer","topic":"Уточнение","kind":"good","min":3,"facts":["MC-28"],"requires":["lawyer-1"],"q":"Были ли споры, где важно было, кто и что делал с картой?","a":"И не один. Последний — владелица кота с Ванеева утверждала, что о диагнозе «знала вся клиника» и это обсуждали при посторонних. Доказать ни то, ни другое мы не смогли: в «ВетБазе» не видно, кто открывал карту. Мне нужен ответ на вопрос «кто и когда смотрел карту». Не что изменил, а именно кто открывал."},{"id":"lawyer-5","who":"lawyer","topic":"Операции","kind":"good","min":3,"facts":["MC-20"],"q":"Что юридически важно при операциях?","a":"Согласие владельца на операцию и на наркоз — до операции, а не после. Подпись на бумаге — фото или скан в карту; подпись в приложении тоже годится, если видно, кто и когда подписал. Протокол операции и наркоза — что ввели, сколько, когда начали и закончили. Если согласия нет, а операция есть — я этот спор проиграю, даже не начав."},{"id":"lawyer-6","who":"lawyer","topic":"Уточнение","kind":"good","min":3,"facts":["MC-17"],"requires":["lawyer-3"],"q":"А если у питомца сменился хозяин — что новый хозяин может увидеть в карте?","a":"Историю здоровья животного — прививки, визиты — видеть должен, это в интересах животного. А вот телефон, фамилию прежнего хозяина, служебные пометки — нет, это чужие персональные данные. Передавать карту — только по заявлению обоих, через администратора, или если прежний хозяин сам сделал это из своего приложения."},{"id":"lawyer-7","who":"lawyer","topic":"Уточнение","kind":"good","min":3,"facts":["MC-29"],"requires":["lawyer-1"],"q":"Как быть, если запись о приёме внесли не сразу, а на следующий день?","a":"Бывает: в Кстове пропал интернет, врач принял на бумаге, внёс позже. Само по себе это нормально. Плохо, когда запись выглядит так, будто сделана во время приёма, а на самом деле — через сутки. Мне надо, чтобы было видно: когда приём был на самом деле и что запись внесена позже."},{"id":"lawyer-8","who":"lawyer","topic":"Решение спора","kind":"conflict","min":5,"facts":["MC-12"],"requiresFacts":["MC-10","MC-11"],"q":"Нина Ивановна хочет исправлять запись в любой момент — опечатка в дозе бывает. А вы говорите: после закрытия менять нельзя. Как совместить?","a":"Опечатки бывают, я не зверь. Давайте так. Врач закрывает визит — по сути, подписывает его. В течение 24 часов после закрытия автор может исправить запись, но каждая версия сохраняется: кто исправил, когда и что было до исправления. После 24 часов исходный текст не меняется вообще — можно только добавить «дополнение» с датой и автором. Тогда и врачу удобно, и мне есть что показать в суде."},{"id":"lawyer-9","who":"lawyer","topic":"Закон","kind":"weak","min":2,"facts":[],"q":"То есть из карты ничего и никогда нельзя удалять, правильно?","a":"Смотря что, смотря когда и смотря кому. На вопрос «да или нет» я отвечу «скорее нет», но толку вам от этого мало. Расскажите, какие ситуации вы имеете в виду, — тогда поговорим предметно."},{"id":"gleb-1","who":"gleb","topic":"Как сейчас","kind":"good","min":4,"facts":["MC-19"],"q":"Где сейчас лежат карты, анализы и снимки?","a":"Карты — в «ВетБазе», три отдельные базы: Ванеева, «Лапа-24», Сормово. Друг с другом не говорят, я пробовал. Анализы «ВетЛаб» шлёт PDF-ками на почту клиники. УЗИ и рентген пишут снимки в DICOM — это тяжёлые файлы, пусть живут на аппаратах, в карту тащить не надо: заключение и пару картинок JPG — хватит. Давай договоримся — до 20 мегабайт на файл. У «ВетЛаба» есть API, но Марина сказала — это 2027-й."},{"id":"gleb-2","who":"gleb","topic":"Миграция","kind":"good","min":4,"facts":["MC-25"],"requires":["gleb-1"],"q":"Что делать со старыми данными из трёх баз «ВетБазы»?","a":"Переносить, куда деваться. Только одна и та же кошка лежит в трёх базах по-разному: «Буся», «Бусинка», телефон с восьмёркой, без восьмёрки. Я бы искал дубли по телефону хозяина плюс кличка плюс вид. Что совпало — склеиваем, что спорное — пусть администратор руками разбирает, машина тут не судья. Сколько лет истории тащить — это у Марины спроси."},{"id":"gleb-3","who":"gleb","topic":"Сроки и объёмы","kind":"good","min":3,"facts":["MC-30"],"q":"Сколько людей одновременно будут работать с картами и как быстро всё должно открываться?","a":"Врачей у нас 38, в пик почти все на приёме — считай, человек сорок одновременно открывают карты. Если карта грузится дольше двух секунд — врач плюнет и вернётся в Word, я их знаю. Так что две секунды — это потолок, а не цель."},{"id":"gleb-4","who":"gleb","topic":"Сбои","kind":"good","min":3,"facts":["MC-29"],"requires":["gleb-3"],"q":"А что будет, если в клинике пропадёт интернет?","a":"В Кстове это не «если», а «когда» — раз-два в месяц на час и дольше. Врачи там всё равно примут: напишут на бумажке, а когда связь вернётся — будут вносить. Только время приёма тогда не «сейчас», а когда кот реально был на столе, и это должно быть видно. Как это сделать технически — пусть разработчик скажет, я в браузерах не мастер."},{"id":"gleb-5","who":"gleb","topic":"Миграция","kind":"good","min":2,"facts":[],"q":"А Excel и бумажные карты из Автозавода и Кстова тоже переносить?","a":"Понятия не имею. Там у каждого врача свой Excel, у кого-то тетрадка, у кого-то вообще только ветпаспорт у хозяина. Марина про это ничего не говорила. Решайте сами — только запишите, что решили, и согласуйте с ней, а то потом скажут, что это я виноват."},{"id":"ksenia-1","who":"ksenia","topic":"Как сейчас","kind":"good","min":3,"facts":["MC-31"],"q":"Расскажите, как вы ходите с Бусей в клинику и что потом остаётся у вас на руках?","a":"Мы ходим часто — у Буси почки, ей двенадцать. Раз в месяц кровь, иногда капельницы. После приёма мне дают распечатку, я её фотографирую, а бумажку теряю. Потом стою в аптеке и листаю галерею: «а сколько ей давать?». Хочу, чтобы выписка сразу приходила в приложение — ну или на почту."},{"id":"ksenia-2","who":"ksenia","topic":"Прививки","kind":"good","min":3,"facts":["MC-08"],"q":"Как вы помните, когда Бусе делать прививку?","a":"Никак не помню, честно. Ветпаспорт где-то в ящике, а в прошлом году мы пропустили бешенство на два месяца — заметила, только когда собрались на дачу. Было бы классно, если бы мне заранее приходило: «прививка через две недели» — и ещё раз ближе к делу, со ссылкой, чтобы сразу записаться. Я всё делаю с телефона."},{"id":"ksenia-3","who":"ksenia","topic":"Уточнение","kind":"good","min":3,"facts":["MC-16"],"requires":["ksenia-1"],"q":"Кто ещё в семье водит Бусю к врачу?","a":"Муж, когда я на работе, — я до семи. И мама иногда. А карта на мой номер, муж приходит — и начинается: «а вы кто?». Хочу, чтобы я могла дать мужу доступ: смотреть карту и записывать Бусю. А если вдруг поссоримся — забрать обратно, ха-ха."},{"id":"ksenia-4","who":"ksenia","topic":"Как сейчас","kind":"good","min":3,"facts":["MC-01"],"q":"Бывает, что вы ходите с Бусей в разные клиники «Лапы»?","a":"Постоянно. Я работаю до семи, поэтому иду туда, где есть вечернее время: то на Ванеева, то в Сормово. И каждый раз заново: «а какой у вас был креатинин?». В Сормове ей снова взяли кровь, хотя за неделю до этого сдавали на Ванеева. Буся кровь сдавать ненавидит, а я плачу дважды."},{"id":"ksenia-5","who":"ksenia","topic":"Приложение","kind":"weak","min":2,"facts":[],"q":"Вы бы хотели видеть карту Буси в телефоне, да?","a":"Да, конечно. А что в ней будет?"},{"id":"ksenia-6","who":"ksenia","topic":"Приложение","kind":"good","min":3,"facts":["MC-22"],"q":"Что бы вам больше всего помогло между приёмами?","a":"Чтобы мне напоминали, когда снова сдавать кровь: Нина Ивановна говорит «через месяц», а через месяц я уже не помню, с какого числа считать. И я дома каждую неделю взвешиваю Бусю на кухонных весах, записываю в заметки — вот бы это тоже было в карте, чтобы доктор видел. И фото, когда она плохо ест."},{"id":"dmitry-1","who":"dmitry","topic":"Как сейчас","kind":"good","min":3,"facts":["MC-18"],"q":"Как вы сейчас следите за здоровьем и прививками своих кошек?","a":"Девять мейн-кунов, у каждого бумажный ветпаспорт, плюс таблица в Excel, где я руками веду, кому когда прививка. Раз в квартал обязательно кто-то просрочен — и это минус выставка. Мне нужен один экран: все мои кошки и у кого ближайшая прививка. Не девять карточек по очереди открывать."},{"id":"dmitry-2","who":"dmitry","topic":"Выставки","kind":"good","min":3,"facts":["MC-08"],"q":"Что у вас проверяют на выставках и при продаже котят?","a":"На выставке ветконтроль смотрит паспорт: какая вакцина, серия, дата, до какого числа действует, подпись врача и печать клиники. Серию, кстати, проверяют — была история с поддельными наклейками. Покупатели котят тоже смотрят паспорт, особенно бешенство. А бумажный паспорт у меня один на кошку, и ездим мы по разным городам."},{"id":"dmitry-3","who":"dmitry","topic":"Уточнение","kind":"good","min":3,"facts":["MC-09"],"requires":["dmitry-2"],"q":"А как бы вам хотелось подтверждать прививки на выставке или в поездке?","a":"Электронной выпиской в PDF — открыл на телефоне, распечатал, если надо. Но PDF любой школьник нарисует, поэтому нужен QR-код: ветконтроль наводит телефон и на сайте «Лапы» видит, что выписка настоящая. Я такое видел на выставке в Хельсинки — очередь на ветконтроль шла втрое быстрее."},{"id":"dmitry-4","who":"dmitry","topic":"Уточнение","kind":"good","min":4,"facts":["MC-17"],"requires":["dmitry-1"],"q":"Что происходит с документами котёнка, когда вы его продаёте?","a":"Паспорт уезжает с новым хозяином — вместе с прививками. Если котёнок уже в вашей системе, хочу так же: передал — и вся его история прививок и визитов у нового хозяина. Но мой телефон, мои пометки и что я там платил — новому хозяину видеть незачем. Передавать я бы хотел сам, из приложения, а если покупатель — бабушка без смартфона, пусть администратор оформит, мы оба придём."}],"docs":[{"id":"d-word","title":"Распечатка приёма из Word","kind":"Документ","from":"Нина Ивановна","intro":"Нина Ивановна достала из папки свежую распечатку: «Вот так я пишу, только не смейтесь. Это я хозяйке отдавала».","facts":["MC-02","MC-15","MC-14"],"html":"<p><b>Ветеринарная клиника «Лапа на Ванеева»</b><br>г. Нижний Новгород, ул. Ванеева, 34</p>\n<p><b>ВНИМАНИЕ!!! ХПН. НПВС НЕ НАЗНАЧАТЬ. При заборе крови кусается — держать вдвоём, в полотенце.</b></p>\n<table>\n<tr><th>Дата приёма</th><td>14.09.2026, 18:40</td></tr>\n<tr><th>Пациент</th><td>Буся, кошка, метис, 12 лет, стерилизована</td></tr>\n<tr><th>Владелец</th><td>Ксения А. (телефон — в «ВетБазе»)</td></tr>\n<tr><th>Врач</th><td>Орлова Н. И., терапевт</td></tr>\n<tr><th>Приём</th><td>повторный <span class=\"muted\">(бланк «Первичный_2019.docx», лишние разделы не удалены)</span></td></tr>\n</table>\n<h4>Жалобы, анамнез</h4>\n<p>Со слов владелицы: 3 дня плохо ест, много пьёт, 1 раз рвота. ХПН на учёте с 2024 г. Кровь сдавали 12.08.2026 в «Лапе в Сормове» — результатов на руках нет, «креатинин был высокий».</p>\n<h4>Объективно</h4>\n<p>Вес 3,4 кг (в июле — 3,7). Т 38,3. Пульс 180. ЧДД 32. Слизистые бледно-розовые, суховаты. Обезвоживание ~5 %. Почки уменьшены, бугристые. Лимфоузлы б/о. Аускультация б/о.</p>\n<h4>Диагноз</h4>\n<p>ХПН, обострение. Ст. 2–3? Исключить пиелонефрит — взять мочу.</p>\n<h4>Назначения</h4>\n<table>\n<tr><th>Препарат</th><th>Доза</th><th>Способ</th><th>Кратность</th><th>Сколько дней</th></tr>\n<tr><td>Р-р Рингера</td><td>60 мл</td><td>п/к</td><td>1 р/д</td><td>5</td></tr>\n<tr><td>Маропитант</td><td>0,5 мл <span class=\"muted\">(зачёркнуто ручкой, сверху от руки «0,35!», без даты и подписи)</span></td><td>п/к</td><td>1 р/д</td><td>3</td></tr>\n<tr><td>Ипакитине</td><td>1 мерная ложка</td><td>с кормом</td><td>2 р/д</td><td>постоянно</td></tr>\n</table>\n<h4>Рекомендации</h4>\n<p>Лечебный корм «ренал». Вода — свободно, 2–3 миски по квартире. Взвешивать дома раз в неделю.</p>\n<h4>Следующий приём</h4>\n<p>Через 7 дней: кровь (креатинин, мочевина, фосфор), моча, осмотр. Записаться у администратора!</p>\n<p>Врач ____________ Орлова Н. И.</p>\n<p><span class=\"muted\">[Нижняя полоса листа отрезана ножницами. На корешке, который остался в папке у Нины Ивановны, от руки: «Хоз-ка очень тревожная, звонит каждый день. Говорить спокойно, без прогнозов. Подозреваю, даёт таблетки «от себя» — уточнить».]</span></p>"},{"id":"d-passport","title":"Ветпаспорт и таблица питомника","kind":"Фото","from":"Дмитрий","intro":"Дмитрий прислал в мессенджер фото разворота ветпаспорта своего кота и скриншот таблицы, которую ведёт сам.","facts":["MC-08","MC-18"],"html":"<p><b>Фото 1. Ветеринарный паспорт, разворот «Вакцинация против бешенства»</b></p>\n<p>Кличка: Один (Odin Maine Wood) · кот · мейн-кун · чёрный мраморный · микрочип 643094100331190</p>\n<table>\n<tr><th>Дата</th><th>Вакцина (наклейка)</th><th>Серия</th><th>Действительно до</th><th>Ветврач</th><th>Печать</th></tr>\n<tr><td>18.10.2023</td><td>Нобивак Рабиес</td><td>A231B02</td><td>18.10.2024</td><td>подпись, «Орлова»</td><td>«Лапа на Ванеева»</td></tr>\n<tr><td>02.11.2024</td><td>Рабикан</td><td>115-0924</td><td>02.11.2025</td><td>подпись неразборчива</td><td>«Лапа в Сормове»</td></tr>\n<tr><td>20.10.2025</td><td>Нобивак Рабиес</td><td><span class=\"muted\">наклейка оторвана</span></td><td>20.10.2026</td><td>подпись неразборчива</td><td>«Лапа-24»</td></tr>\n</table>\n<p><b>Фото 2. Скриншот «Прививки — питомник Maine Wood.xlsx»</b></p>\n<table>\n<tr><th>Кошка</th><th>Пол</th><th>Г. р.</th><th>Бешенство до</th><th>Комплексная до</th><th>Где делали</th><th>Пометки</th></tr>\n<tr><td>Один</td><td>кот</td><td>2018</td><td>20.10.2026</td><td>20.10.2026</td><td>VAN, SRM, L24</td><td>выставка 25.10 — УСПЕТЬ!</td></tr>\n<tr><td>Тор</td><td>кот</td><td>2020</td><td>10.11.2026</td><td>10.11.2026</td><td>VAN</td><td></td></tr>\n<tr><td>Ингрид</td><td>кошка</td><td>2021</td><td>02.04.2027</td><td>15.01.2027</td><td>SRM</td><td></td></tr>\n<tr><td>Фрейя</td><td>кошка</td><td>2022</td><td>28.10.2026</td><td>28.10.2026</td><td>SRM</td><td>котята 05.2026 — когда прививать её саму?</td></tr>\n<tr><td>Сага</td><td>кошка</td><td>2019</td><td>14.09.2026</td><td>01.02.2027</td><td>L24</td><td>просрочено!! не пустили на выставку</td></tr>\n<tr><td>Локи</td><td>кот</td><td>2023</td><td>05.12.2026</td><td>05.12.2026</td><td>VAN</td><td></td></tr>\n<tr><td>Хельга</td><td>кошка</td><td>2024</td><td>30.01.2027</td><td>30.01.2027</td><td>SRM</td><td></td></tr>\n<tr><td>Ирма</td><td>кошка</td><td>2020</td><td>?</td><td>?</td><td>—</td><td>паспорт у жены на даче</td></tr>\n<tr><td>Бальдр</td><td>кот</td><td>2025</td><td>18.03.2027</td><td>18.03.2027</td><td>VAN</td><td></td></tr>\n</table>\n<p><span class=\"muted\">Под таблицей: «Котята Фрейи (5 шт.): 3 проданы, паспорта отдал новым хозяевам; 2 ещё у нас, вторая прививка 20.10».</span></p>"},{"id":"d-vetbaza","title":"Выгрузка из «ВетБазы»: одна кошка в трёх базах","kind":"Выгрузка","from":"Глеб","intro":"Глеб выгрузил из трёх баз «ВетБазы» всё, что нашёл по телефонам Ксении и Дмитрия, и склеил в одну таблицу: «На, полюбуйся».","facts":["MC-25","MC-01"],"html":"<p><code>vetbaza_pets_export.csv</code> — склеено вручную из трёх баз (VAN, L24, SRM), поиск по телефону и по чипу.</p>\n<table>\n<tr><th>база</th><th>id</th><th>кличка</th><th>вид</th><th>порода</th><th>д. р.</th><th>тел_владельца</th><th>владелец</th><th>чип</th><th>посл_визит</th><th>визитов</th></tr>\n<tr><td>VAN</td><td>14872</td><td>Буся</td><td>кошка</td><td>метис</td><td>03.2014</td><td>89000001234</td><td>Ксения А.</td><td></td><td>14.09.2026</td><td>37</td></tr>\n<tr><td>SRM</td><td>3310</td><td>Бусинка</td><td>кот</td><td></td><td>2014</td><td>+7 900 000-12-34</td><td>Ксения</td><td></td><td>12.08.2026</td><td>6</td></tr>\n<tr><td>L24</td><td>22051</td><td>БУСЯ</td><td>кошка</td><td>б/п</td><td></td><td>9000001234</td><td>А-ва К.</td><td></td><td>03.01.2025</td><td>1</td></tr>\n<tr><td>VAN</td><td>9077</td><td>Буся</td><td>собака</td><td>той-терьер</td><td>2017</td><td>89000005678</td><td>Мария П.</td><td></td><td>30.06.2026</td><td>12</td></tr>\n<tr><td>VAN</td><td>12004</td><td>Один</td><td>кот</td><td>мейн кун</td><td>2018</td><td>89000009900</td><td>Дмитрий</td><td>643094100331190</td><td>05.06.2025</td><td>9</td></tr>\n<tr><td>SRM</td><td>2988</td><td>Odin Maine Wood</td><td>кошка</td><td>мейн-кун</td><td>2018</td><td>89000007788</td><td>ИП Д.</td><td>643094100331190</td><td>02.11.2024</td><td>3</td></tr>\n<tr><td>L24</td><td>19530</td><td>Один</td><td>кот</td><td>MCO</td><td></td><td>89000009900</td><td>Дмитрий</td><td></td><td>20.10.2025</td><td>1</td></tr>\n</table>\n<p>Заметки Глеба на полях:</p>\n<ul>\n<li>Телефоны пишут кто как: с 8, с +7, без кода, с пробелами и дефисами.</li>\n<li>В Сормове «кот/кошка» иногда вбивают в поле «вид» вместо пола.</li>\n<li>Отдельной таблицы прививок в «ВетБазе» нет — они внутри визитов, текстом: «Нобивак Рабиес, с. A231B02».</li>\n<li>Чип заполнен редко. Где заполнен — совпадает, даже когда телефоны разные.</li>\n<li>В VAN история визитов лет за десять, в Сормове — поменьше. Тащить всё — долго.</li>\n<li>Всего в базах около 31 тыс. питомцев на 22 тыс. владельцев — сколько из них дублей, не считал.</li>\n<li>Автозавод и Кстово — Excel и бумага, в выгрузку не попали.</li>\n</ul>"},{"id":"d-claim","title":"Письмо юриста о претензии владельца","kind":"Письмо","from":"Алексей Петрович","intro":"Марина Сергеевна переслала письмо юриста с припиской: «Олеся, почитайте, чтобы такого больше не было».","facts":["MC-11","MC-29","MC-28"],"html":"<p><b>От:</b> Алексей Петрович, юрист<br><b>Кому:</b> М. С. Беловой<br><b>Тема:</b> Претензия гр. Н. по собаке Рекс — итоги и выводы</p>\n<p>Марина Сергеевна, добрый день.</p>\n<p>Коротко по претензии гр. Н. (собака Рекс, лабрадор, 7 лет, приём в «Лапе в Кстове» 14.08.2026 в 16:30). Владелец утверждает, что врач назначил тройную дозу препарата, после чего у собаки была рвота, и требует возместить лечение в сторонней клинике.</p>\n<p>Что мы смогли предъявить и почему этого оказалось мало:</p>\n<ul>\n<li>Запись приёма из Excel-файла клиники: доза указана верная. Однако файл изменён 15.08.2026 в 10:12. Врач пояснила, что 14.08 в Кстове с обеда не было интернета, она приняла собаку «на листочке» и перенесла запись утром. Листочек не сохранился.</li>\n<li>Представитель владельца заявил, что запись «исправили после жалобы». Опровергнуть нам нечем: в файле не видно, что было до изменения, кто и когда его вносил.</li>\n<li>Владелец также заявил, что о диагнозе собаки «судачили в регистратуре». Кто открывал файл и когда — установить невозможно.</li>\n</ul>\n<p>Итог: урегулировали миром, вернули стоимость приёма. Сумма небольшая, но прецедент неприятный, и следующий может быть дороже.</p>\n<p>Прошу учесть в новой системе. Медицинская запись после завершения приёма — документ, на который мы ссылаемся в споре; если её можно незаметно поменять, это уже не доказательство. Запись, внесённая не во время приёма, должна быть видна как таковая — с указанием, когда на самом деле был приём. И нужен ответ на вопрос «кто смотрел карту».</p>\n<p>С уважением, А. П.</p>"},{"id":"d-hospital","title":"Лист назначений стационара","kind":"Фото","from":"Юлия","intro":"Юлия сфотографировала лист назначений с поста стационара L24 — «пока не выбросили».","facts":["MC-07","MC-23"],"html":"<p><b>«Лапа-24» · стационар · лист назначений · бокс 7</b></p>\n<p>Пациент: Джек, пёс, метис, ~5 лет. Поступил 03.10.2026 в 02:40 — экстренно, без записи (сбит машиной). Принял дежурный врач. Оперировал Ковалёв А. (03.10, 04:10–05:30).</p>\n<table>\n<tr><th>Дата</th><th>Вес</th><th>Кто взвешивал</th></tr>\n<tr><td>03.10</td><td>24,0 кг</td><td>со слов хозяина</td></tr>\n<tr><td>04.10</td><td>22,6 кг</td><td>Ю.</td></tr>\n<tr><td>05.10</td><td>22,4 кг</td><td>Ю.</td></tr>\n</table>\n<table>\n<tr><th>Назначение</th><th>Доза</th><th>08:00</th><th>12:00</th><th>16:00</th><th>20:00</th><th>00:00</th><th>04:00</th></tr>\n<tr><td>Рингер в/в капельно</td><td>40 мл/ч</td><td>✓ Ю.</td><td>✓ Ю.</td><td>✓</td><td>✓ А.</td><td>✓</td><td>—</td></tr>\n<tr><td>Цефтриаксон в/в</td><td>600 мг <span class=\"muted\">(считали на 24 кг)</span></td><td>✓ Ю.</td><td></td><td></td><td>✓</td><td></td><td></td></tr>\n<tr><td>Обезболивание</td><td>по схеме врача</td><td>✓ Ю.</td><td></td><td>✓ Ю.</td><td></td><td>✓</td><td></td></tr>\n<tr><td>Выгул, моча</td><td></td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td></td><td></td></tr>\n</table>\n<p><span class=\"muted\">На полях рукой Юлии: «Вес упал на 1,6 кг — дозы пересчитать? Спросить А. К.» · «В 20:00 галочка есть, подписи нет — кто колол???» · «Перенести в „ВетБазу“ — к утру не успела».</span></p>"}],"seams":[{"id":"S1","with":"booking","partner":"Эльнара","title":"Запись ↔ Медкарта","give":["Событие medcard.followup.planned — врач запланировал повторный приём или вакцинацию","GET /api/v1/medcard/pets/{petId}/specialist-visits — визиты питомца к специалисту (запись проверяет, можно ли онлайн на повторный к узкому специалисту)","Факт начала и закрытия приёма — каким способом, договориться"],"take":["События записи booking.appointment.created | rescheduled | cancelled | checked_in | no_show","Данные записи: appointmentId, petId, ownerId, clinicId, doctorId, serviceCode, startsAt, endsAt, ownerComment («что беспокоит»)","Список записей врача на день — откуда и как, договориться"],"base":"<p>Базовый контракт задал наставник — его нельзя ломать:</p>\n<pre>booking публикует:\n  booking.appointment.created | rescheduled | cancelled | checked_in | no_show\n  data: appointmentId, petId, ownerId, clinicId, doctorId,\n        serviceCode, startsAt, endsAt, ownerComment\n\nmedcard публикует:\n  medcard.followup.planned\n  {petId, reason: revisit|vaccination, dueDate, serviceCode, doctorId?, clinicId?}\n\nmedcard даёт:\n  GET /api/v1/medcard/pets/{petId}/specialist-visits?specialization=&sinceDate=\n  → список визитов к специалисту</pre>","agree":["Где врач видит свой день (список записей) и откуда открывает приём — экран какой фичи?","Кто и как переводит запись в «на приёме» и «завершена»; как визит в медкарте связан с записью; что с экстренными приёмами без записи.","Кто отправляет владельцу напоминание о повторном приёме и вакцинации, чтобы владелец не получил два сообщения.","Что из записи попадает в медкарту (комментарий владельца «что беспокоит» → жалоба)."]},{"id":"S2","with":"billing","partner":"Никита","title":"Медкарта ↔ Счёт","give":["Событие medcard.visit.closed со списком оказанных услуг и использованных препаратов items: [{itemCode, qty, unit}]","Что происходит со списком позиций, если врач исправил визит после закрытия, — договориться","Согласие владельца на операцию — как оно связано со сметой, договориться"],"take":["Каталог услуг, препаратов и товаров: GET /api/v1/billing/catalog/items?type=service|drug|goods&q=&clinicId=","Тип позиции и единица измерения из каталога","Смета на операцию — где живёт и как на неё сослаться, договориться"],"base":"<p>Базовый контракт задал наставник — его нельзя ломать:</p>\n<pre>billing ведёт каталог:\n  GET /api/v1/billing/catalog/items?type=service|drug|goods&q=&clinicId=\n\nmedcard публикует:\n  medcard.visit.closed\n  {visitId, petId, ownerId, clinicId, doctorId, appointmentId?,\n   startedAt, closedAt, items: [{itemCode, qty, unit}]}</pre>","agree":["Что делать, если врач исправил визит после закрытия и список услуг изменился — до оплаты и после оплаты.","Смета на операцию: где составляется, где хранится, как связана с согласием владельца на операцию.","Стационар: счёт копится несколько дней — как медкарта передаёт услуги по дням.","Единицы измерения препаратов (мл, таблетка, доза) — чьи и как согласованы."]}],"hints":{"context":["Начни с письма Марины Сергеевны и раздела «Зачем»: сформулируй одной фразой, чью боль снимает медкарта и как Марина поймёт, что всё получилось.","Раздели зоны: что даёт платформа (питомец, владелец, вход и роли, файлы, уведомления, аудит), что делают соседи (запись — Эльнара, счёт и каталог — Никита) и что остаётся тебе. Кличка, вид и чип питомца — не твои таблицы.","Почти ответ: цель — одна карта на 5 клиник вместо трёх баз «ВетБазы», Excel и бумаги (18 % питомцев ходят в 2+ клиники); визит заполняется за 3–5 минут вместо 10; всё, что врач сделал, уходит в счёт (утечка 4 % → меньше 1 %). Пользователи: врач, ассистент, администратор, управляющий, владелец и тот, кому владелец доверил питомца. Пилот — март 2027, VAN и L24."],"docs":["Документы — не картинки для настроения. Читай их как улики: какие в них есть поля, о которых никто не сказал на интервью, и что в них испорчено — зачёркнуто, задвоено, отрезано.","Сравни распечатку Нины Ивановны с выгрузкой Глеба: как одно и то же животное записано в разных базах? Посмотри, что Нина Ивановна НЕ отдала хозяйке. В письме юриста ищи, чего не хватило, чтобы выиграть спор.","Почти ответ: Word — структура визита, предупреждение сверху, доза исправлена ручкой без даты и автора, отрезанная «пометка для себя»; паспорт — серия и «действует до», просрочки, 9 кошек в самодельной таблице, проданные котята; выгрузка — дубли с разными кличками, видами, форматами телефона и одинаковым чипом, прививки текстом внутри визитов; письмо — запись изменена задним числом без истории, нет журнала просмотров; лист стационара — пациент ночью без записи и вес, от которого считают дозы."],"interview":["Начинай с открытых вопросов: «как сейчас?», «что бывает, когда…?», «расскажите про последний случай». Закрытые вопросы («вам ведь удобно?») и вопросы про кнопки дают мало — попробуй и сравни.","Часть важного открывается только уточняющими вопросами. Возвращайся к людям: что из карты нельзя показывать владельцу, кто ещё в семье водит питомца, что с картой при продаже котёнка, что делает врач без интернета, кто открывал карту, что делать со старыми базами.","Почти ответ: ищи два спора — про диагноз (Марина ↔ Нина) и про исправление записей (Нина ↔ юрист). Когда обе позиции спора в блокноте, появится вопрос к тому, кто вправе решить. Не уходи без Глеба (старые базы, нагрузка, интернет), Дмитрия (выставки, продажа котят), Ксении (семья), юриста (сроки хранения, журнал, запись задним числом). Если человек говорит «решайте сами» — это допущение, запиши его."],"analysis":["Разложи блокнот по категориям: цели, рамки, роли, правила, данные, статусы, сценарии, нефункциональные требования, стыки, юридическое, миграция. Пустая категория — сигнал, что кого-то не спросили.","Для каждого спора запиши обе позиции, кто принял решение и почему. Для каждого «не знаю» — допущение, которое согласуешь с Мариной. Отдельно — просьбы вне рамок (стационар, дневник владельца), чтобы их не потерять и не сделать по ошибке.","Почти ответ: два решённых спора (MC-06, MC-12), минимум два допущения (Excel и бумага AVT/KST при миграции; какой вес считать, если ассистент и врач взвесили по-разному) и матрица доступа: по строкам — врач, ассистент, администратор, управляющий, владелец, доверенное лицо, новый владелец после передачи; по столбцам — блок «Важно», служебная заметка, диагноз, назначения, вес, вакцинации, файлы."],"seams":["Базовый контракт S1 и S2 менять нельзя — его задал наставник. Выпиши вопросы «Договорить» и приходи на встречу с Эльнарой и Никитой со своим предложением, а не с пустыми руками.","S1: на каком экране врач видит свой день, кто переводит запись в «на приёме» и «завершена», как экстренный визит живёт без записи, кто шлёт напоминание о прививке и повторе. S2: что делать со счётом, если врач исправил визит после закрытия, где живёт смета, а где согласие, чьи единицы препаратов. И подумай, кому ещё, кроме тебя, нужно право «доверенного лица».","Почти ответ: «Мой день» и «Начать приём» логично держать в медкарте, читая записи через API записи; завершение записи — по событию закрытия визита; экстренный визит — без appointmentId; напоминание шлёт тот, кто знает график прививок, а второй молчит. Исправление после закрытия → отдельное событие с полным новым списком позиций; до оплаты и после оплаты у счёта разные действия. Смета — у счёта, согласие — у тебя со ссылкой на смету. Запиши стыки одинаково в оба пакета."],"scenarios":["Опиши основной сценарий: врач открыл свой день → начал приём по записи → ассистент внёс вес → врач заполнил визит → закрыл → услуги ушли в счёт, владелец получил выписку, запланирован следующий визит.","Потом альтернативы и исключения: экстренный без записи, приём внесён позже (нет интернета), исправление после закрытия, дополнение через несколько дней, операция без согласия, передача котёнка новому владельцу, доверенное лицо, удаление данных владельца, визит открыт не тому питомцу.","Почти ответ: у каждого сценария — кто (роль), предусловие (статус визита), шаги, результат и что уходит наружу (событие, уведомление, аудит). Правила вынеси в нумерованный список и ссылайся на них из шагов: окончательный диагноз из справочника при закрытии; исправлять — только автор и только в окне; потом — только дополнение; без согласия операцию не начать; служебная заметка не уходит владельцу ни в каком виде."],"data":["Нарисуй сущности медкарты и связи между ними. Питомец и владелец живут в платформе — у тебя только ссылки petId и ownerId.","Подумай про историю: версии визита, дополнения, история веса, журнал просмотров. Что нужно сохранить «снимком» на момент визита — клинику, врача, его специализацию, владельца? Что станет с ownerId после удаления данных владельца?","Почти ответ: визит (предварительный и окончательный диагноз, отметка «внесено позже» и фактическое время), осмотр, назначения, позиции из каталога (itemCode, qty с точностью 0,1, unit из каталога), версии визита, дополнения, справочник диагнозов с кодом «Другое», вес, вакцинации, файлы (fileId платформы), блок «Важно», операция и согласие (со ссылкой на смету счёта), доверенные лица, передачи, журнал просмотров, выписки с кодом для QR. Плюс статусная модель визита: переходы и кто их делает."],"api":["Следуй соглашениям: /api/v1/medcard/..., UUID, время ISO 8601 со смещением, ошибки problem+json с машинным кодом, Idempotency-Key на всё, что создаёт записи, пагинация limit/cursor.","Действия, которые не CRUD, — подресурсом: закрыть визит, добавить дополнение, начать операцию, передать питомца. Для каждого эндпоинта — какие роли и что каждая роль видит в ответе (владельцу и администратору — разное).","Почти ответ: карта питомца, поиск, «Мой день», начать / получить / изменить / закрыть визит, версии, дополнения, позиции из каталога, файлы, вес, вакцинации, выписка PDF и публичная проверка по коду из QR, блок «Важно», операция и согласие, доверенные лица, передача, журнал просмотров, specialist-visits для записи, список питомцев владельца с ближайшими прививками. События: visit.closed, visit.amended, followup.planned (+ по желанию visit.started). Коды ошибок вида VISIT_LOCKED, NOT_VISIT_AUTHOR, FINAL_DIAGNOSIS_REQUIRED, CONSENT_REQUIRED, FILE_TOO_LARGE."],"nfr":["Выпиши все числа из блокнота: сколько врачей одновременно, как быстро открывается карта, размер файлов, сроки хранения.","Нефункциональные требования — не только скорость: что происходит без интернета, кто и что видит, что пишется в аудит, что делается по запросу на удаление персональных данных, когда работают клиники (L24 — круглосуточно).","Почти ответ: карта открывается не дольше 2 с (p95) при ~40 одновременных врачах; файл до 20 МБ; медзаписи хранятся не меньше 5 лет после последнего визита; по platform.owner.deleted — обезличивание, а не удаление; журнал просмотров; закрытие, исправления, дополнения, передача — в аудит платформы; работа круглосуточно (L24); без интернета — ввод задним числом с отметкой «внесено позже», а не офлайн-приложение (решишь иначе — обоснуй)."],"acceptance":["Пиши критерии в формате «Дано / Когда / Тогда» с конкретными людьми, временем и числами, а не «система работает корректно».","Покрой правила, на которых легко ошибиться: окно на исправление, кто видит служебную заметку, видит ли администратор диагноз, операция без согласия, передача котёнка, экстренный визит без записи, повтор одного и того же события.","Почти ответ: заведи тестовых персонажей — Буся (кошка, 12 лет, ХПН, визиты в VAN и SRM, дубли в старых базах), мейн-куны Дмитрия (9 кошек, котёнок на продажу), собака ночью в L24 без записи, приём в KST без интернета. Пример: «Дано: визит Буси закрыт Орловой 03.11.2026 в 18:40. Когда: Орлова меняет дозу 04.11.2026 в 18:45. Тогда: изменение отклонено с кодом ошибки, доступно только дополнение»."],"aicheck":["Перечитай пакет глазами ИИ-разработчика: он сделает ровно то, что написано, а всё «понятное и так» угадает по-своему.","Ищи слова «удобно», «быстро», «и т. п.», «при необходимости»; поля без типов; действия без ролей; ошибки без кодов; события без полей и без правила обработки повторов.","Почти ответ: дай пакет ИИ и попроси перечислить вопросы, которые он задал бы перед кодом, и противоречия между разделами. Проверь вручную: у каждого эндпоинта роли и коды ошибок; у каждого события — конверт и обработка повторов по eventId; стыки слово в слово совпадают с пакетами Эльнары и Никиты; «не входит» записано явно; ни одна роль, кроме врача, не получает служебную заметку."]},"examples":[{"bad":"К визиту можно прикреплять файлы.","good":"Роли doctor и assistant прикрепляют к визиту файл PDF или JPG до 20 МБ: сначала POST /api/v1/platform/files, затем POST /api/v1/medcard/visits/{visitId}/files {fileId, kind: lab|photo|imaging_report} с Idempotency-Key. Больше 20 МБ — 413 FILE_TOO_LARGE, другой формат — 415 UNSUPPORTED_FILE_TYPE."},{"bad":"Нужен поиск питомца.","good":"GET /api/v1/medcard/pets/search?q=&limit= (роли doctor, assistant, admin, manager): q из 15 цифр — точный поиск по чипу; q, похожий на телефон, — нормализуем к +7XXXXXXXXXX и ищем питомцев владельца; иначе — по началу клички без учёта регистра. В ответе: petId, кличка, вид, порода, год рождения, ФИО владельца."},{"bad":"Операцию нельзя проводить без согласия.","good":"POST /api/v1/medcard/operations/{operationId}/start (роль doctor) возвращает 409 CONSENT_REQUIRED, если у операции нет подписанного согласия владельца: скан бумажного бланка (fileId) или подпись в приложении (ownerId, signedAt). Одно согласие покрывает операцию и анестезию."},{"bad":"Владельцу надо напоминать о прививках.","good":"За 14 и за 3 дня до validUntil последней вакцинации каждого типа владельцу уходит уведомление через POST /api/v1/platform/notifications (channel auto, template vaccination_due, dedupKey vacc-{vaccinationId}-14d и vacc-{vaccinationId}-3d) со ссылкой на запись с предзаполненной услугой. Если после неё уже есть более свежая вакцинация того же типа — не отправляется."}]};</script>
<script>// Движок задания: рендер вкладок из window.COMMON + window.FEATURE, состояние ученика в localStorage.
(function () {
  const C = window.COMMON, F = window.FEATURE;
  const META = C.features.find(x => x.code === F.code);
  const STORE = 'lapa-' + F.code + '-v1';
  document.documentElement.style.setProperty('--feat', META.color);

  // ---------- состояние ----------
  const blank = () => ({ tab: 'start', nb: {}, asked: [], free: [], docNotes: {}, docsSeen: {}, assum: [], open: [], notes: [], hints: {}, stages: {}, checks: {}, agree: {}, person: null, doc: null, theme: null });
  let S = blank();
  try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);

  const facts = new Map(F.facts.map(f => [f.id, f]));
  const qmap = new Map(F.questions.map(q => [q.id, q]));
  const people = new Map(F.people.map(p => [p.id, p]));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = sel => document.querySelector(sel);

  // ---------- логика интервью ----------
  const asked = id => S.asked.includes(id);
  const inNb = id => !!S.nb[id];
  const available = q => !asked(q.id) && (q.requires || []).every(asked) && (q.requiresFacts || []).every(inNb);
  const minutes = who => S.asked.map(id => qmap.get(id)).filter(q => q && (!who || q.who === who)).reduce((s, q) => s + q.min, 0)
    + S.free.filter(x => !who || x.who === who).length * 4;
  const hintsUsed = () => Object.values(S.hints).reduce((s, n) => s + n, 0);
  const conflictPairs = () => {
    const out = [], seen = new Set();
    for (const f of F.facts) if (f.conflict && !seen.has(f.id)) {
      seen.add(f.id); seen.add(f.conflict);
      const res = F.questions.find(q => q.kind === 'conflict' && (q.requiresFacts || []).includes(f.id) && (q.requiresFacts || []).includes(f.conflict));
      out.push({ a: f.id, b: f.conflict, res });
    }
    return out;
  };

  function addFact(id, src) {
    if (S.nb[id]) return;
    S.nb[id] = { src, at: Date.now() };
    const f = facts.get(id);
    if (f && f.conflict && S.nb[f.conflict]) toast('⚔ Найдено противоречие — посмотри в блокноте');
    const fresh = F.questions.filter(q => (q.requiresFacts || []).includes(id) && available(q));
    if (fresh.length) setTimeout(() => toast('Можно вернуться с этим к «' + people.get(fresh[0].who).name + '»'), 1600);
  }

  // ---------- общие куски ----------
  const logo = `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient></defs><rect width="120" height="120" rx="28" fill="url(#lg)"/><path d="M34 88 L60 28 L86 88" fill="none" stroke="#0a0a12" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#0a0a12"><rect x="47" y="66" width="6" height="11" rx="3"/><rect x="57" y="59" width="6" height="18" rx="3"/><rect x="67" y="63" width="6" height="14" rx="3"/></g></svg>`;

  const TABS = [
    ['start', 'Задание'], ['product', 'Продукт'], ['brief', 'Запрос заказчика'], ['docs', 'Документы'],
    ['interview', 'Интервью'], ['notebook', 'Блокнот'], ['seams', 'Стыки'], ['guides', 'Шпаргалки'], ['pack', 'Сдача'],
  ];

  function seamMap(active) {
    const fx = C.features;
    const pos = { booking: [130, 70], medcard: [430, 70], billing: [280, 300] };
    const edges = [['booking', 'medcard', 'S1'], ['medcard', 'billing', 'S2'], ['booking', 'billing', 'S3']];
    let s = `<svg viewBox="0 0 560 370" role="img" aria-label="Карта стыков трёх фич">`;
    for (const [a, b, id] of edges) {
      const [x1, y1] = pos[a], [x2, y2] = pos[b];
      const mine = a === active || b === active;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${mine ? 'var(--fg2)' : 'var(--line)'}" stroke-width="${mine ? 2.5 : 1.5}" ${mine ? '' : 'stroke-dasharray="5 5"'}/>`;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      s += `<rect x="${mx - 17}" y="${my - 12}" width="34" height="24" rx="6" fill="var(--s3)" stroke="var(--line)"/><text x="${mx}" y="${my + 5}" text-anchor="middle" font-size="12.5" font-weight="600" style="font-family:var(--f-mono)">${id}</text>`;
    }
    s += `<circle cx="280" cy="150" r="40" fill="var(--s2)" stroke="var(--line)" stroke-dasharray="3 4"/><text x="280" y="146" text-anchor="middle" font-size="12.5" font-weight="600">Платформа</text><text x="280" y="163" text-anchor="middle" class="sub">наставник</text>`;
    for (const f of fx) {
      const [x, y] = pos[f.code], me = f.code === active;
      s += `<g><rect x="${x - 105}" y="${y - 38}" width="210" height="76" rx="12" fill="var(--s1)" stroke="${f.color}" stroke-width="${me ? 3 : 1.5}"/>`
        + `<text x="${x}" y="${y - 8}" text-anchor="middle" font-size="15" font-weight="700" style="font-family:var(--f-head)">${f.icon} ${esc(f.title.replace('Электронная медкарта питомца', 'Медкарта питомца'))}</text>`
        + `<text x="${x}" y="${y + 16}" text-anchor="middle" class="sub">${esc(f.student)}${me ? ' · это ты' : ''}</text></g>`;
    }
    return s + `</svg>`;
  }

  function hintBlock(stageId) {
    const h = F.hints[stageId] || [];
    const n = S.hints[stageId] || 0;
    const lv = ['Направление', 'Конкретнее', 'Почти ответ'];
    let out = `<div class="hints">`;
    for (let i = 0; i < n; i++) out += `<div class="hint"><span class="lv">Подсказка ${i + 1} · ${lv[i]}</span>${h[i]}</div>`;
    if (n < h.length) out += `<div><button class="btn sm ghost" data-act="hint" data-id="${stageId}">💡 ${n ? 'Ещё подсказка' : 'Подсказка'} (${n + 1} из ${h.length})</button></div>`;
    return out + `</div>`;
  }

  // ---------- вкладки ----------
  function pStart() {

        <p class="lead">Пакет пойдёт в настоящую разработку: наставник соберёт продукт с ИИ-разработчиком строго по пакетам вашей тройки. Чего нет в пакете — того не будет в продукте.</p>

      <div class="note warn"><b>Что сдаёшь в конце</b><p>Папку <code>lapa-${F.code}</code>: <code>SPEC.md</code>, <code>openapi.yaml</code>, <code>seed.json</code>, <code>README.md</code> и выгрузку блокнота <code>interview-notes.md</code>. Шаблоны — на вкладке «Сдача».</p></div>
    </section>
    <section class="sec">
      <div class="row" style="justify-content:space-between"><h2>Маршрут</h2><span class="muted small">${done} из ${C.stages.length} шагов отмечено · подсказок открыто: ${hintsUsed()}</span></div>
      <div class="progress"><i style="width:${Math.round(done / C.stages.length * 100)}%"></i></div>
      <p class="muted small">Рекомендуемый темп — неделя: день 1 — шаги 1–4, день 2 — стыковая встреча, дни 3–5 — спецификация, день 6 — приёмка и проверка, день 7 — запас. Открытые подсказки попадают в выгрузку блокнота — это нормально, наставник просто видит, где было трудно.</p>
      <div class="route">`;
    C.stages.forEach((st, i) => {
      const isDone = !!S.stages[st.id];
      h += `<details class="stage${isDone ? ' done' : ''}" ${S.openStage === st.id ? 'open' : ''} data-stage="${st.id}">
        <summary><span class="num">${isDone ? '✓' : i + 1}</span><span><span class="st-t">${esc(st.t)}</span><br><span class="st-m">${esc(st.time)} · результат: ${esc(st.result[0].toLowerCase() + st.result.slice(1))}</span></span><span class="muted small">▾</span></summary>
        <div class="stage-body">
          <p class="simple">${st.simple}</p>
          <ul>${st.do.map(d => `<li>${d}</li>`).join('')}</ul>
          ${(C.stageGuides[st.id] || []).length ? `<div class="row small"><span class="muted">Шпаргалки:</span>${C.stageGuides[st.id].map(g => `<button class="btn sm" data-act="guide" data-id="${g}">📎 ${esc(C.guides.find(x => x.id === g).t)}</button>`).join('')}</div>` : ''}
          ${st.id === 'interview' ? `<div class="row small"><span class="muted">Шпаргалки:</span><button class="btn sm" data-act="guide" data-id="ask">📎 Как задавать вопросы</button></div>` : ''}
          ${hintBlock(st.id)}
          ${(C.stageReady[st.id] || []).length ? `<div class="card flat"><span class="eyebrow">Шаг готов, если</span>${C.stageReady[st.id].map((r, j) => { const k = st.id + ':' + j; return `<label class="check"><input type="checkbox" data-act="ready" data-id="${k}" ${S.ready && S.ready[k] ? 'checked' : ''}><span class="small">${esc(r)}</span></label>`; }).join('')}</div>` : ''}
          <label class="check"><input type="checkbox" data-act="stage" data-id="${st.id}" ${isDone ? 'checked' : ''}> <span>Шаг сделан</span></label>
        </div></details>`;
    });
    h += `</div></section></div>`;
    return h;
  }

      <section class="sec"><span class="eyebrow">Общий контекст — одинаковый у всей тройки</span><h1>Продукт «Лапа»</h1>

      <section class="docs"><nav class="doc-list" aria-label="Документы">${F.docs.map(d => `<button class="doc-btn" data-act="doc" data-id="${d.id}" aria-current="${d.id === cur.id}"><span class="k">${esc(d.kind)}</span><span>${esc(d.title)}</span>${S.docsSeen[d.id] ? '<span class="seen">✓ прочитан</span>' : ''}</button>`).join('')}</nav>
      <div class="doc-view"><div><h2>${esc(cur.title)}</h2><p class="muted small">${esc(cur.kind)} · от: ${esc(cur.from || '—')} · ${esc(cur.intro)}</p></div>

  function qaBlock(q, a, fids, src) {
    let h = `<div class="qa"><div class="ask">${esc(q)}</div><div class="say">${a}</div>`;

      h += `<div class="facts-out">${fids.map(id => {

          ? `<div class="fact-add in"><span class="t">${esc(f.text)}</span><span class="chip acc">в блокноте</span></div>`
          : `<div class="fact-add"><span class="t">${esc(f.text)}</span><button class="btn sm" data-act="add" data-id="${id}" data-src="${esc(src)}">＋ В блокнот</button></div>`;
      }).join('')}</div>`;
    }

  function exportMd() {

      `Итоги: фактов ${Object.keys(S.nb).length}, интервью ${minutes()} мин, вопросов ${S.asked.length + S.free.length}, документов прочитано ${Object.keys(S.docsSeen).length} из ${F.docs.length}, подсказок открыто ${hintsUsed()}.`, ''];

      const list = Object.keys(S.nb).filter(id => facts.get(id)?.cat === cat);

      lines.push(`## ${label}`, '');
      for (const id of list) lines.push(`- ${facts.get(id).text}  \n  _Источник: ${srcLabel(S.nb[id].src)}_`);

    }
    const dn = F.docs.filter(d => (S.docNotes[d.id] || '').trim());
    if (dn.length) { lines.push('## Заметки по документам', ''); for (const d of dn) lines.push(`### ${d.title}`, '', S.docNotes[d.id].trim(), ''); }
    for (const [k, t] of [['assum', 'Допущения'], ['open', 'Открытые вопросы'], ['notes', 'Прочие заметки']]) if (S[k].length) { lines.push(`## ${t}`, '', ...S[k].map(x => `- ${x}`), ''); }
    lines.push('## Журнал интервью', '');
    for (const p of F.people) {
      const qs = S.asked.map(id => qmap.get(id)).filter(q => q && q.who === p.id);
      const fr = S.free.filter(x => x.who === p.id);
      if (!qs.length && !fr.length) continue;
      lines.push(`### ${p.name} (${p.role}) — ${minutes(p.id)} мин`, '');
      for (const q of qs) lines.push(`- **${q.q}**  \n  ${q.a.replace(/<[^>]+>/g, '')}`);
      for (const x of fr) lines.push(`- **${x.q}** _(свой вопрос)_  \n  ${x.a}`);
      lines.push('');

    const code = { c: F.code, f: Object.keys(S.nb), q: S.asked.length, fr: S.free.length, m: minutes(), h: S.hints, d: Object.keys(S.docsSeen).length };
    let enc = ''; try { enc = btoa(unescape(encodeURIComponent(JSON.stringify(code)))); } catch (e) {}
    lines.push('---', '', 'Код для наставника (вставить в ключ проверки):', '', '```', 'LAPA1:' + enc, '```', '');

  let dlCap;
  async function saveFile(name, text) {
    if (window.claude && dlCap === undefined) { try { dlCap = await window.claude.use('downloads'); } catch (e) { dlCap = null; } }
    if (dlCap) {
      try { await dlCap.save({ filename: name, data: text }); toast('Сохранено: ' + name); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { copy(text); }
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Скопировано'); } catch (e2) { toast('Не получилось скопировать — выдели текст вручную'); }
      ta.remove();
    }
  }
  let tt;
  function toast(t) {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2600);
  }

  let sample = null;

  function showFree() { const b = $('#free-box'); if (b && sample) b.hidden = false; }

  async function askFree(pid) {
    const ta = $('#free-q'), st = $('#free-st'), btn = document.querySelector('[data-act="free"]');
    const text = (ta.value || '').trim(); if (!text || !sample) return;
    const p = people.get(pid);
    const qs = F.questions.filter(q => q.who === pid && (q.requiresFacts || []).every(inNb));
    const known = [...new Set(qs.flatMap(q => q.facts))].map(id => `${id}: ${facts.get(id).text}`).join('\n');
    const examples = qs.filter(q => q.kind === 'good').slice(0, 5).map(q => `Вопрос: ${q.q}\nОтвет: ${q.a.replace(/<[^>]+>/g, '')}`).join('\n\n');
    const prompt = `Ты играешь роль персонажа в учебном симуляторе интервью для начинающего системного аналитика. Продукт — «Лапа», сеть ветеринарных клиник в Нижнем Новгороде.
Персонаж: ${p.name}, ${p.role}. Как начинает разговор: «${p.hello.replace(/<[^>]+>/g, '')}».

Персонаж знает ТОЛЬКО эти факты:
${known}

Примеры того, как персонаж отвечает:
${examples}

Правила ответа:
- По-русски, от первого лица, 2–5 предложений, разговорно, в характере. Без терминов аналитика («бизнес-правило», «статус», «эндпоинт», «требование»).
- Опирайся только на факты из списка, не выдумывай новых чисел и правил. Если вопрос о том, чего в фактах нет, честно скажи, что не знаешь или не задумывался(-ась), и предложи решить это аналитику или спросить другого человека.
- Отвечай только на то, о чём спросили, не пересказывай всё подряд.
- Если спрашивают про решение (какая кнопка, какая база, какой экран), скажи, что тебе это неважно, и расскажи о своей проблеме, если она есть в фактах.
- Если вопрос не по делу или некорректный — вежливо верни разговор к работе.

Верни только JSON: {"answer": "текст ответа", "facts": ["ID фактов, на которые реально опирается ответ"]}.

Вопрос аналитика: ${text}`;
    btn.disabled = true; st.textContent = `${p.name.split(' ')[0]} думает…`;
    try {
      const r = await sample.json(prompt, { cache: false });
      const ans = String(r && r.answer || '').trim();
      if (!ans) throw { code: 'invalid_json' };
      const fs = (Array.isArray(r.facts) ? r.facts : []).map(String).filter(id => facts.has(id) && qs.some(q => q.facts.includes(id)));
      S.free.push({ who: pid, q: text, a: ans, facts: fs }); save(); render();
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { sample = null; const b = $('#free-box'); if (b) b.hidden = true; return; }
      st.textContent = code === 'rate_limited' ? 'Слишком много вопросов подряд — попробуй через минуту.' : 'Ответ не пришёл. Попробуй переформулировать вопрос.';
      btn.disabled = false;
    }
  }
